<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Cartridge frame: the shell from a ScreenScraper
     support-2D scan, label window cut out, label-clip marking where the
     label goes. -->
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg1"
   sodipodi:docname="NGP-clear.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"><defs
     id="defs1"><filter
       inkscape:label="Colorize Clear"
       inkscape:menu="Color"
       inkscape:menu-tooltip="Blend image or object with a flat colour"
       style="color-interpolation-filters:sRGB"
       id="colorize-clear"><feColorMatrix
         type="saturate"
         values="0"
         result="desaturated"
         id="feColorMatrix-colorize" /><feComponentTransfer
         in="desaturated"
         result="plastic"
         id="feComponentTransfer-colorize"><feFuncR
           type="linear"
           slope="1.7386"
           intercept="0.7136" /><feFuncG
           type="linear"
           slope="1.7386"
           intercept="0.7136" /><feFuncB
           type="linear"
           slope="1.7386"
           intercept="0.7136" /></feComponentTransfer><feFlood
         flood-opacity="1"
         flood-color="#B9C0C7"
         result="flood"
         id="feFlood-colorize" /><feBlend
         in="flood"
         in2="plastic"
         mode="multiply"
         result="blend"
         id="feBlend-colorize" /><feComposite
         in="blend"
         in2="desaturated"
         operator="in"
         result="composite1"
         id="feComposite-colorize" /></filter></defs><g
     id="layer1"><rect
       style="fill:#00ff00;stroke:none"
       id="label-clip"
       inkscape:label="label-clip"
       width="315.333"
       height="171.333"
       x="42.667"
       y="103.333" /><image
       style="filter:url(#colorize-clear)"
       inkscape:label="frame"
       width="400"
       height="400"
       preserveAspectRatio="none"
       xlink:href="data:image/png;base64,"
       id="image1"
       x="0"
       y="0" /></g></svg>
