<!DOCTYPE html>
<!-- Generated by tools/build_site.py from site/page.html and site/strings/<locale>.json.
     Edit those and run the script; an edit made here is overwritten, and tests/test_site.py fails on it. -->
<html lang="{{html_lang}}"{{auto_attr}}>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{meta.title}}
  <meta name="description"
    {{meta.description}}
  <link rel="icon" href="{{root}}assets/logo.png" />
  <meta property="og:title" {{meta.og_title}}
  <meta property="og:description"
    {{meta.og_description}}
  <meta property="og:image" content="https://guilhermefeitosa66.github.io/OpenEmux/assets/openemux-roms-snes.png" />
  <meta property="og:url" content="{{canonical}}" />
  <link rel="canonical" href="{{canonical}}" />
{{hreflang_links}}
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --bg: #08060f;
      --bg-2: #0e0a1c;
      --panel: #151029;
      --line: rgba(255, 255, 255, .09);
      --violet: #8b5cf6;
      --violet-deep: #5b21b6;
      --gold: #ffd21e;
      --text: #f4f1ff;
      --muted: #a9a2c4;
      --radius: 18px;
      --maxw: 1140px;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      /* Safety net: nothing may widen the document past the viewport on phones.
         `clip` (not `hidden`) keeps the sticky header working. */
      overflow-x: clip;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Cantarell, "Noto Sans", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block
    }

    a {
      color: var(--gold);
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px
    }

    /* Grid items default to `min-width: auto`, so a child that cannot wrap
       (a <pre> line, a long URL) pushes its column wider than the track and
       drags the whole document past the viewport. */
    .grid>*,
    .steps>*,
    .split>*,
    .gallery>*,
    .carousel-track>* {
      min-width: 0
    }

    section {
      padding: 96px 0;
      border-top: 1px solid var(--line)
    }

    h2 {
      font-size: clamp(1.9rem, 3.6vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -.02em;
      margin: 0 0 14px
    }

    h3 {
      font-size: 1.1rem;
      margin: 0 0 6px;
      letter-spacing: -.01em
    }

    p {
      margin: 0 0 16px
    }

    .lede {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 60ch
    }

    .center {
      text-align: center
    }

    .center .lede {
      margin-left: auto;
      margin-right: auto
    }

    .eyebrow {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* ---------- nav ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 6, 15, .72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -.02em
    }

    .brand:hover {
      text-decoration: none
    }

    .brand img {
      width: 30px;
      height: 30px
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      gap: 26px;
      align-items: center
    }

    .nav-links a {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 500
    }

    .nav-links a:hover {
      color: var(--text);
      text-decoration: none
    }

    /* The full link row needs ~832px next to the brand; collapse it before
       that, or the Download button is pushed past the viewport edge. */
    @media(max-width:860px) {
      .nav-links a:not(.btn) {
        display: none
      }
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border-radius: 999px;
      font-weight: 650;
      font-size: .95rem;
      border: 1px solid transparent;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover {
      text-decoration: none;
      transform: translateY(-2px)
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
      box-shadow: 0 10px 34px rgba(139, 92, 246, .42);
    }

    .btn-primary:hover {
      box-shadow: 0 16px 44px rgba(139, 92, 246, .58)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .05);
      border-color: var(--line);
      color: var(--text)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .1)
    }

    .btn-sm {
      padding: 9px 18px;
      font-size: .87rem
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-top: 0;
      padding: 104px 0 0;
      background:
        radial-gradient(900px 460px at 50% -8%, rgba(139, 92, 246, .4), transparent 68%),
        radial-gradient(600px 380px at 88% 12%, rgba(255, 210, 30, .1), transparent 62%),
        linear-gradient(180deg, var(--bg-2), var(--bg) 78%);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .5;
      pointer-events: none;
      background-image:
        radial-gradient(1.4px 1.4px at 12% 22%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 28% 68%, #d8c8ff, transparent),
        radial-gradient(1.6px 1.6px at 44% 14%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 62% 52%, #ffe9a8, transparent),
        radial-gradient(1.5px 1.5px at 76% 26%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 88% 62%, #cdb8ff, transparent),
        radial-gradient(1.3px 1.3px at 8% 78%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 54% 84%, #fff, transparent);
    }

    .hero-inner {
      position: relative;
      text-align: center
    }

    /* Announcement pill above the headline — carries whatever is new this
       release without touching the h1. */
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 18px 7px 9px;
      margin: 0 0 22px;
      border-radius: 999px;
      background: rgba(139, 92, 246, .13);
      border: 1px solid rgba(139, 92, 246, .42);
      color: var(--text);
      font-size: .88rem;
      font-weight: 600;
    }

    .hero-pill:hover {
      text-decoration: none;
      background: rgba(139, 92, 246, .22);
      border-color: rgba(139, 92, 246, .7);
    }

    .beta {
      flex: none;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255, 210, 30, .13);
      border: 1px solid rgba(255, 210, 30, .4);
      border-radius: 999px;
      padding: 4px 10px;
      line-height: 1;
    }

    .hero-logo {
      width: 118px;
      height: 118px;
      margin: 0 auto 26px;
      filter: drop-shadow(0 18px 40px rgba(139, 92, 246, .55))
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      line-height: 1.04;
      letter-spacing: -.035em;
      margin: 0 0 20px;
      font-weight: 800;
    }

    .hero h1 .grad {
      background: linear-gradient(100deg, #c4b5fd, #fff 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.lede {
      margin: 0 auto 32px;
      font-size: 1.18rem
    }

    .cta {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap
    }

    .cta-note {
      margin-top: 16px;
      font-size: .85rem;
      color: var(--muted)
    }

    .shot {
      margin: 64px auto -110px;
      max-width: 1000px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 50px 120px rgba(0, 0, 0, .75), 0 0 0 1px rgba(139, 92, 246, .16);
    }

    .hero-pad {
      height: 130px
    }

    /* ---------- feature grid ---------- */
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 44px
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:600px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: linear-gradient(180deg, var(--panel), rgba(21, 16, 41, .45));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
      transition: transform .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, .5)
    }

    .card p {
      color: var(--muted);
      font-size: .94rem;
      margin: 0
    }

    .ico {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: rgba(139, 92, 246, .16);
      border: 1px solid rgba(139, 92, 246, .32);
      margin-bottom: 16px;
      font-size: 1.25rem;
    }

    /* ---------- split ---------- */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center
    }

    @media(max-width:860px) {
      .split {
        grid-template-columns: 1fr;
        gap: 36px
      }
    }

    .split img,
    .frame {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
    }

    ul.checks {
      list-style: none;
      padding: 0;
      margin: 22px 0 0
    }

    ul.checks li {
      padding-left: 28px;
      position: relative;
      color: var(--muted);
      margin-bottom: 11px
    }

    ul.checks li::before {
      content: "▸";
      position: absolute;
      left: 6px;
      color: var(--gold);
      font-weight: 700
    }

    ul.checks strong {
      color: var(--text)
    }

    /* ---------- systems ---------- */
    .systems {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 36px
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: .86rem;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }

    .chip:hover {
      color: var(--text);
      border-color: rgba(139, 92, 246, .55);
      background: rgba(139, 92, 246, .12)
    }

    /* ---------- gallery ---------- */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 40px
    }

    @media(max-width:700px) {
      .gallery {
        grid-template-columns: 1fr
      }
    }

    .gallery img {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    .gallery.thirds {
      grid-template-columns: repeat(3, 1fr)
    }

    @media(max-width:700px) {
      .gallery.thirds {
        grid-template-columns: 1fr
      }
    }

    figure {
      margin: 0
    }

    figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    /* ---------- install ---------- */
    .steps {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 44px;
      text-align: left
    }

    @media(max-width:820px) {
      .steps {
        grid-template-columns: 1fr
      }
    }

    .platform-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.4rem;
      letter-spacing: -.02em;
      margin: 52px 0 0;
    }

    .platform-head+.lede {
      margin: 10px auto 0;
      font-size: 1rem;
    }

    .platform-head+.steps,
    .platform-head+.lede+.steps {
      margin-top: 20px;
    }

    .step-n {
      max-width: 120px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: #1a1206;
      font-weight: 800;
      font-size: .9rem;
      margin-bottom: 14px;
    }

    pre {
      background: #05040b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      max-width: 100%;
      margin: 0;
    }

    code {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .85rem;
      color: #c7f0d8
    }

    /* ---------- support ---------- */
    .support {
      background: linear-gradient(135deg, rgba(139, 92, 246, .14), rgba(255, 210, 30, .07));
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 22px;
      padding: 52px 32px;
      text-align: center;
    }

    /* ---------- footer ---------- */
    footer {
      border-top: 1px solid var(--line);
      padding: 52px 0;
      color: var(--muted);
      font-size: .9rem
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center
    }

    .foot-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap
    }

    .foot-links a {
      color: var(--muted)
    }

    .foot-links a:hover {
      color: var(--text)
    }

    .disclaimer {
      margin-top: 26px;
      font-size: .8rem;
      color: #6f688c;
      max-width: 70ch
    }

    /* "Shelf" carousel: 3 console shots per slide, dots + wrap-around arrows */
    .carousel {
      position: relative;
      margin-top: 36px
    }

    .carousel-stage {
      position: relative
    }

    .carousel-viewport {
      overflow: hidden
    }

    .carousel-track {
      display: flex;
      transition: transform .45s cubic-bezier(.4, 0, .2, 1);
      will-change: transform
    }

    .carousel-track figure {
      flex: 0 0 33.3333%;
      box-sizing: border-box;
      padding: 0 10px;
      margin: 0
    }

    @media(max-width:820px) {
      .carousel-track figure {
        flex-basis: 100%
      }
    }

    .carousel-track img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    .carousel-track figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    .carousel-btn {
      position: absolute;
      top: 44%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 16, 40, .82);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .92;
      transition: background .15s ease, opacity .15s ease
    }

    .carousel-btn:hover {
      opacity: 1;
      background: rgba(50, 40, 86, .95)
    }

    .carousel-prev {
      left: -8px
    }

    .carousel-next {
      right: -8px
    }

    @media(max-width:560px) {
      .carousel-prev {
        left: 2px
      }

      .carousel-next {
        right: 2px
      }
    }

    .carousel-dots {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin-top: 22px;
      flex-wrap: wrap
    }

    .carousel-dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
      transition: background .2s ease, width .2s ease
    }

    .carousel-dots button.active {
      background: var(--violet);
      width: 24px
    }

    /* Zoomable screenshots -> lightbox */
    .shot img,
    .gallery img,
    .split img,
    .carousel-track img {
      cursor: zoom-in;
      transition: transform .15s ease
    }

    .carousel-track img:hover,
    .gallery img:hover {
      transform: translateY(-3px)
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 4, 16, .9);
      padding: 24px;
      backdrop-filter: blur(4px)
    }

    .lightbox.open {
      display: flex
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .7)
    }

    .lightbox-close {
      position: fixed;
      top: 14px;
      right: 22px;
      width: 44px;
      height: 44px;
      font-size: 1.9rem;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      opacity: .9
    }

    .lightbox-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, .16)
    }

    .lightbox-cap {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #d8d3ea;
      font-size: .9rem;
      pointer-events: none
    }

    /* ---------- phones ---------- */
    @media(max-width:600px) {
      .wrap {
        padding: 0 16px
      }

      section {
        padding: 64px 0
      }

      .card {
        padding: 20px
      }

      .support {
        padding: 36px 20px
      }

      /* Wrap commands at spaces instead of forcing a wide line; the <pre>
         keeps its own scrollbar for the odd unbreakable token. */
      pre {
        white-space: pre-wrap;
        padding: 12px 14px
      }

      code {
        font-size: .8rem
      }

      .lightbox {
        padding: 12px
      }
    }
    /* ---------- language picker ---------- */
    /* A <details> menu of plain links: it opens and works without JavaScript,
       and each entry is the same page in another language. */
    .lang-switch {
      position: relative;
      flex: none
    }

    .lang-switch summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none
    }

    .lang-switch summary::-webkit-details-marker {
      display: none
    }

    .lang-switch summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-2px) rotate(45deg)
    }

    .lang-switch[open] summary::after {
      transform: translateY(2px) rotate(-135deg)
    }

    .lang-switch summary:hover,
    .lang-switch[open] summary {
      background: var(--panel)
    }

    .lang-switch .flag {
      font-size: 1.15rem;
      line-height: 1
    }

    .lang-switch ul {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      margin: 0;
      padding: 6px;
      list-style: none;
      min-width: 210px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
      z-index: 60
    }

    .lang-switch li a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem
    }

    .lang-switch li a:hover {
      background: rgba(255, 255, 255, .06);
      text-decoration: none
    }

    .lang-switch li a[aria-current="page"] {
      background: rgba(139, 92, 246, .22);
      font-weight: 700
    }

    /* On a phone the header holds the brand, Download and the picker: the
       flag alone says which language is on. */
    @media(max-width:560px) {
      .lang-switch .lang-name {
        display: none
      }
    }
  </style>
  <script src="{{root}}lang.js"></script>
</head>

<body>

  <header>
    <div class="wrap nav">
      <a class="brand" href="#top"><img src="{{root}}assets/logo.png" alt="" /> OpenEmux</a>
      <nav class="nav-links">
        {{nav.features}}
        {{nav.systems}}
        {{nav.screenshots}}
        {{nav.install}}
        <a href="https://github.com/guilhermefeitosa66/OpenEmux">GitHub</a>
        {{nav.community}}
        <a class="btn btn-primary btn-sm"
          {{nav.download}}
      {{lang_switcher}}
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="top">
    <div class="stars"></div>
    <div class="wrap hero-inner">
      <img class="hero-logo" src="{{root}}assets/logo.png" {{hero.logo_alt}}
      <a class="hero-pill" href="#install">{{hero.pill}}
      {{hero.title}}
      {{hero.lede}}

  <!-- Lightbox: click any screenshot to view it full-size (e-commerce style) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" {{lightbox.label}}
    <button class="lightbox-close" id="lightboxClose" {{lightbox.close}}
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-cap" id="lightboxCap"></div>
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightboxImg');
      var cap = document.getElementById('lightboxCap');
      var closeBtn = document.getElementById('lightboxClose');

      function open(src, alt, caption) {
        img.src = src;
        img.alt = alt || '';
        cap.textContent = caption || alt || '';
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        box.classList.remove('open');
        document.body.style.overflow = '';
        img.src = '';
      }

      document.querySelectorAll('.shot img, .gallery img, .split img, .carousel-track img').forEach(function (el) {
        el.addEventListener('click', function () {
          var fig = el.closest('figure');
          var caption = fig ? (fig.querySelector('figcaption') || {}).textContent : '';
          open(el.currentSrc || el.src, el.alt, caption);
        });
      });

      closeBtn.addEventListener('click', close);
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('open')) close();
      });
    })();

    // Shelf carousel: 3 shots per slide (1 on mobile), dots, and wrap-around arrows.
    (function () {
      var root = document.getElementById('shelfCarousel');
      if (!root) return;
      var viewport = root.querySelector('.carousel-viewport');
      var track = root.querySelector('.carousel-track');
      var dotsWrap = root.querySelector('.carousel-dots');
      var prev = root.querySelector('.carousel-prev');
      var next = root.querySelector('.carousel-next');
      var count = track.children.length;
      var page = 0, pages = 1;

      function perView() { return window.matchMedia('(max-width:820px)').matches ? 1 : 3; }

      function render() {
        // Shift by whole viewport widths; clamp the last slide to the end so it
        // always shows a full group of images (no empty trailing slots).
        var maxShift = Math.max(0, track.scrollWidth - viewport.clientWidth);
        var shift = Math.min(page * viewport.clientWidth, maxShift);
        track.style.transform = 'translateX(' + (-shift) + 'px)';
        var dots = dotsWrap.children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === page);
      }

      function go(p) { page = (p % pages + pages) % pages; render(); }  // wrap-around

      function build() {
        pages = Math.ceil(count / perView());
        if (page > pages - 1) page = pages - 1;
        dotsWrap.innerHTML = '';
        for (var i = 0; i < pages; i++) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', {{js.slide}} + (i + 1));
          (function (idx) { b.addEventListener('click', function () { go(idx); }); })(i);
          dotsWrap.appendChild(b);
        }
        render();
      }

      prev.addEventListener('click', function () { go(page - 1); });
      next.addEventListener('click', function () { go(page + 1); });
      var t;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(build, 120); });
      build();
    })();
  </script>
