<!DOCTYPE html>
<!-- Generated by tools/build_site.py from site/page.html and site/strings/<locale>.json.
     Edit those and run the script; an edit made here is overwritten, and tests/test_site.py fails on it. -->
<html lang="{{html_lang}}"{{auto_attr}}>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{meta.title}}
  <meta name="description"
    {{meta.description}}
  <link rel="icon" href="{{root}}assets/logo-128.png" />
  <meta property="og:title" {{meta.og_title}}
  <meta property="og:description"
    {{meta.og_description}}
  <meta property="og:image" content="https://guilhermefeitosa66.github.io/OpenEmux/assets/og-opening.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="{{canonical}}" />
  <link rel="canonical" href="{{canonical}}" />
{{hreflang_links}}
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --bg: #08060f;
      --bg-2: #0e0a1c;
      --panel: #151029;
      --line: rgba(255, 255, 255, .09);
      --violet: #8b5cf6;
      --violet-deep: #5b21b6;
      --gold: #ffd21e;
      --text: #f4f1ff;
      --muted: #a9a2c4;
      --radius: 18px;
      --maxw: 1140px;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      /* Safety net: nothing may widen the document past the viewport on phones.
         `clip` (not `hidden`) keeps the sticky header working. */
      overflow-x: clip;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Cantarell, "Noto Sans", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* height:auto keeps the aspect ratio of an <img> that carries width and
       height attributes (set so the page does not shift while it loads). */
    img {
      max-width: 100%;
      height: auto;
      display: block
    }

    a {
      color: var(--gold);
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px
    }

    /* Grid items default to `min-width: auto`, so a child that cannot wrap
       (a <pre> line, a long URL) pushes its column wider than the track and
       drags the whole document past the viewport. */
    .grid>*,
    .steps>*,
    .gallery>*,
    .carousel-track>* {
      min-width: 0
    }

    section {
      padding: 96px 0;
      border-top: 1px solid var(--line)
    }

    h2 {
      font-size: clamp(1.9rem, 3.6vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -.02em;
      margin: 0 0 14px
    }

    h3 {
      font-size: 1.1rem;
      margin: 0 0 6px;
      letter-spacing: -.01em
    }

    p {
      margin: 0 0 16px
    }

    .lede {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 60ch
    }

    .center {
      text-align: center
    }

    .center .lede {
      margin-left: auto;
      margin-right: auto
    }

    .eyebrow {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* ---------- nav ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 6, 15, .72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -.02em
    }

    .brand:hover {
      text-decoration: none
    }

    .brand img {
      width: 30px;
      height: 30px
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      gap: 20px;
      align-items: center
    }

    .nav-links a {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 500;
      white-space: nowrap
    }

    .nav-links a:hover {
      color: var(--text);
      text-decoration: none
    }

    /* The full link row needs up to ~1100px next to the brand (French is the
       longest); collapse it before that, or the links wrap onto two lines and
       the Download button is pushed past the viewport edge. */
    @media(max-width:1099px) {
      .nav-links a:not(.btn) {
        display: none
      }
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border-radius: 999px;
      font-weight: 650;
      font-size: .95rem;
      border: 1px solid transparent;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover {
      text-decoration: none;
      transform: translateY(-2px)
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
      box-shadow: 0 10px 34px rgba(139, 92, 246, .42);
    }

    .btn-primary:hover {
      box-shadow: 0 16px 44px rgba(139, 92, 246, .58)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .05);
      border-color: var(--line);
      color: var(--text)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .1)
    }

    .btn-sm {
      padding: 9px 18px;
      font-size: .87rem
    }

    /* ---------- scroll stages ----------
       A stage is a tall section (`data-stage`, height `--stage-len`) whose
       `.stage-sticky` box holds still in the viewport while the section
       scrolls past. The progress through it, 0 -> 1, plays the @keyframes of
       its `data-stage-layer` elements. Each layer's keyframes span the whole
       stage, so its own timing lives in the stops, and one set of keyframes
       serves both drivers: CSS scroll-driven animations where the browser has
       them, the script at the end of the page (which writes `--p`) elsewhere.
       Scrolling itself is never touched: no snap, no wheel or touch handler.
       Without a driver the CSS below IS the final composition, which is what
       reduced motion, no JavaScript, older browsers and screens too short for
       the stage get, at the section's natural height. Only transform and opacity animate. */
    :root {
      --nav-h: 65px
    }

    /* Motion needs the stage to fit while it holds still: 560px of height
       at phone width (only the devices hold), 640px in the wide layout
       (copy and devices together). Below that the final composition. */
    @media (prefers-reduced-motion: no-preference) and (max-width: 899px) and (min-height: 560px),
    (prefers-reduced-motion: no-preference) and (min-height: 640px) {
      @supports (animation-timeline: view()) {
        [data-stage] {
          view-timeline: --stage block;
          view-timeline-inset: var(--nav-h) 0;
          min-height: var(--stage-len, 260vh)
        }

        [data-stage] .stage-sticky {
          position: sticky;
          top: var(--nav-h)
        }

        [data-stage] [data-stage-layer] {
          animation-timeline: --stage;
          animation-range: contain 0% contain 100%;
          animation-duration: auto;
          animation-timing-function: linear;
          animation-fill-mode: both
        }
      }

      [data-stage].stage-js {
        min-height: var(--stage-len, 260vh)
      }

      .stage-js .stage-sticky {
        position: sticky;
        top: var(--nav-h)
      }

      .stage-js [data-stage-layer] {
        animation-duration: 1s;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-play-state: paused;
        animation-delay: calc(var(--p, 0) * -1s)
      }

      [data-stage].is-active [data-stage-layer] {
        will-change: transform, opacity
      }
    }

    /* ---------- hero (the opening stage) ---------- */
    .hero {
      --stage-len: 260vh;
      position: relative;
      border-top: 0;
      padding: 0;
    }

    /* Positioned for the stars; a driver makes it sticky, so this stays a
       single-class rule the driver's selectors win over. */
    .stage-sticky {
      position: relative
    }

    .hero .stage-sticky {
      overflow: clip;
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      padding: 56px 0;
      box-sizing: border-box;
      background:
        radial-gradient(900px 460px at 30% -8%, rgba(139, 92, 246, .4), transparent 68%),
        radial-gradient(600px 380px at 88% 12%, rgba(255, 210, 30, .1), transparent 62%),
        linear-gradient(180deg, var(--bg-2), var(--bg) 78%);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .5;
      pointer-events: none;
      background-image:
        radial-gradient(1.4px 1.4px at 12% 22%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 28% 68%, #d8c8ff, transparent),
        radial-gradient(1.6px 1.6px at 44% 14%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 62% 52%, #ffe9a8, transparent),
        radial-gradient(1.5px 1.5px at 76% 26%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 88% 62%, #cdb8ff, transparent),
        radial-gradient(1.3px 1.3px at 8% 78%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 54% 84%, #fff, transparent);
    }

    /* Wide: copy on the left, the devices on the right, both in one screen. */
    .hero-inner {
      position: relative;
      width: 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
      gap: 48px;
      align-items: center
    }

    .beta {
      flex: none;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255, 210, 30, .13);
      border: 1px solid rgba(255, 210, 30, .4);
      border-radius: 999px;
      padding: 4px 10px;
      line-height: 1;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 4.2vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: -.035em;
      margin: 0 0 18px;
      font-weight: 800;
    }

    .hero h1 .grad {
      background: linear-gradient(100deg, #c4b5fd, #fff 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.lede {
      margin: 0 0 26px;
      font-size: 1.12rem
    }

    .cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .cta-note {
      margin: 12px 0 0;
      font-size: .82rem;
      color: var(--muted)
    }

    .hero-links {
      margin: 18px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      font-weight: 600
    }

    /* The desktop window with the phone over its lower right corner, so both
       read as one product. Frames are CSS, not baked into the screenshots:
       the desktop capture already has the app's own header bar and window
       buttons, so its frame is the border, the corners and the shadow. */
    .stage-devices {
      position: relative;
      padding: 0 0 48px;
      perspective: 1600px
    }

    .device-desktop {
      width: 88%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 50px 120px rgba(0, 0, 0, .75), 0 0 0 1px rgba(139, 92, 246, .16);
      transform-origin: 50% 100%;
      animation-name: stage-desktop-in
    }

    .device-desktop img,
    .device-phone img {
      width: 100%;
      cursor: zoom-in
    }

    /* The screen sits exactly in the middle of the body: the same bezel on
       all four sides (padding; the <img> is a block, so no line gap below
       it) and concentric corners, the screen's radius being the body's
       minus its border and the bezel. */
    .device-phone {
      --phone-r: 24px;
      --bezel: 6px;
      position: absolute;
      right: 0;
      bottom: 0;
      width: 23%;
      padding: var(--bezel);
      box-sizing: border-box;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: var(--phone-r);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .7);
      animation-name: stage-phone-in
    }

    .device-phone img {
      border-radius: calc(var(--phone-r) - var(--bezel) - 1px)
    }

    /* The window flattens into place over the first 40% of the stage; the
       phone arrives from 30% to 75%; the rest holds the composition. */
    @keyframes stage-desktop-in {
      0% {
        transform: translateY(7%) rotateX(16deg) scale(.9);
        animation-timing-function: cubic-bezier(.33, 1, .68, 1)
      }

      40%,
      100% {
        transform: translateY(0) rotateX(0) scale(1)
      }
    }

    @keyframes stage-phone-in {
      0%,
      30% {
        opacity: 0;
        transform: translate(18%, 60%) rotate(7deg);
        animation-timing-function: cubic-bezier(.33, 1, .68, 1)
      }

      48% {
        opacity: 1
      }

      75%,
      100% {
        opacity: 1;
        transform: translate(0, 0) rotate(0)
      }
    }

    /* Wide: the whole stage, copy included, has to fit one screen while it
       holds still, so the copy column is set tighter than a normal section. */
    @media(min-width:900px) {
      .hero .stage-sticky {
        padding: 28px 0
      }

      .hero h1 {
        font-size: clamp(2.2rem, 3.4vw, 3.1rem);
        margin-bottom: 14px
      }

      .hero p.lede {
        margin-bottom: 20px;
        font-size: 1.05rem
      }

      .hero .cta {
        gap: 10px
      }

      .hero .cta .btn {
        padding: 10px 16px;
        font-size: .95rem
      }

      .hero-links {
        margin-top: 14px
      }

      .hero .cta-note {
        margin-top: 10px;
        font-size: .78rem
      }
    }

    /* Phone width: copy on top, the window and then the phone stacked under
       it (nothing overlaps). The devices block is what holds still. */
    @media(max-width:899px) {
      .hero {
        --stage-len: 240vh
      }

      .hero .stage-sticky {
        display: block;
        padding: 40px 0 32px
      }

      .hero-inner {
        grid-template-columns: minmax(0, 1fr);
        gap: 32px;
        text-align: center
      }

      .cta,
      .hero-links {
        justify-content: center
      }

      /* The lede is a 60ch box: centre the box, not only its lines. */
      .hero p.lede {
        margin-left: auto;
        margin-right: auto
      }

      .stage-devices {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 0
      }

      .device-desktop {
        width: 100%
      }

      .device-phone {
        --phone-r: 18px;
        --bezel: 4px;
        position: relative;
        width: 34%
      }
    }

    /* With a driver at phone width the box that holds still is the devices
       block, so the copy above it scrolls away first. Its containing block
       has to be as tall as the stage for it to travel. */
    @media (max-width: 899px) and (prefers-reduced-motion: no-preference) and (min-height: 560px) {
      @supports (animation-timeline: view()) {
        [data-stage].hero .stage-sticky {
          position: relative;
          top: auto;
          min-height: var(--stage-len)
        }

        [data-stage].hero .hero-inner {
          display: block;
          min-height: calc(var(--stage-len) - 72px)
        }

        [data-stage].hero .stage-devices {
          position: sticky;
          top: calc(var(--nav-h) + 12px);
          margin-top: 32px
        }
      }

      .hero.stage-js .stage-sticky {
        position: relative;
        top: auto;
        min-height: var(--stage-len)
      }

      .hero.stage-js .hero-inner {
        display: block;
        min-height: calc(var(--stage-len) - 72px)
      }

      .hero.stage-js .stage-devices {
        position: sticky;
        top: calc(var(--nav-h) + 12px);
        margin-top: 32px
      }
    }

    /* ---------- moments ---------- */
    .moment h2 {
      font-size: clamp(1.9rem, 4vw, 2.8rem)
    }

    /* ---------- Share nearby (a scroll stage) ----------
       Without a driver: a strip of four cards, each with the computer's
       capture and the phone's over its lower left corner. With one: the
       four steps stacked in one place on the stage, each step's devices
       fading in over the one before and its caption replacing the last.
       Steps start at 34%, 56% and 78% of the stage: the header above the
       sticky box takes the first ~15% of the scroll before it holds. */
    .share-seq {
      list-style: none;
      padding: 0;
      margin: 44px 0 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      text-align: left;
      counter-reset: step
    }

    .share-step {
      min-width: 0;
      counter-increment: step;
      background: linear-gradient(180deg, var(--panel), rgba(21, 16, 41, .45));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px
    }

    .share-step::before {
      content: counter(step);
      display: block;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 10px
    }

    .share-shots {
      position: relative;
      padding-bottom: 14%;
      margin-bottom: 16px
    }

    /* The computer's capture is the app's own window (header bar and window
       buttons included): its frame is the border, the corners and the
       shadow, never a second title bar. */
    .share-window {
      display: grid;
      width: 84%;
      margin-left: auto;
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6)
    }

    /* The capture received and the library after it share one place. */
    .share-window img,
    .share-lib {
      grid-area: 1 / 1
    }

    /* The screen sits exactly in the middle of the body (the same bezel on
       all four sides) with concentric corners: the screen's radius is the
       body's minus its border and the bezel. Sizes change per layout
       through --phone-r and --bezel only. */
    .share-phone {
      --phone-r: 12px;
      --bezel: 3px;
      position: absolute;
      left: 0;
      bottom: 0;
      width: 27%;
      padding: var(--bezel);
      box-sizing: border-box;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: var(--phone-r);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .65)
    }

    .share-phone img {
      width: 100%;
      border-radius: calc(var(--phone-r) - var(--bezel) - 1px)
    }

    .share-cap h3 {
      font-size: 1rem
    }

    .share-cap p {
      color: var(--muted);
      font-size: .94rem;
      margin: 0
    }

    .share-link,
    .share-meter {
      display: none
    }

    @media(max-width:900px) {
      .share-seq {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:520px) {
      .share-seq {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    /* Each animated layer names its keyframes with a single class, so the
       short-screen rule below (an id) can switch them all off. */
    .share-in-2 { animation-name: share-in-2 }
    .share-in-3 { animation-name: share-in-3 }
    .share-in-4 { animation-name: share-in-4 }
    .share-settle-2 { animation-name: share-settle-2 }
    .share-settle-3 { animation-name: share-settle-3 }
    .share-settle-4 { animation-name: share-settle-4 }
    .share-lib-in { animation-name: share-lib-in }
    .share-cap-1 { animation-name: share-cap-1 }
    .share-cap-2 { animation-name: share-cap-2 }
    .share-cap-3 { animation-name: share-cap-3 }
    .share-cap-4 { animation-name: share-cap-4 }
    .share-done { animation-name: share-done }
    .share-now { animation-name: share-now }

    @keyframes share-in-2 {
      0%, 34% { opacity: 0 }
      40%, 100% { opacity: 1 }
    }

    @keyframes share-in-3 {
      0%, 56% { opacity: 0 }
      62%, 100% { opacity: 1 }
    }

    @keyframes share-in-4 {
      0%, 78% { opacity: 0 }
      84%, 100% { opacity: 1 }
    }

    /* Step 4's second half: the received dialog gives way to the library. */
    @keyframes share-lib-in {
      0%, 90% { opacity: 0 }
      95%, 100% { opacity: 1 }
    }

    /* The phone settles 12px as its screen changes; the computer holds. */
    @keyframes share-settle-2 {
      0%, 34% { transform: translateY(12px) }
      40%, 100% { transform: translateY(0) }
    }

    @keyframes share-settle-3 {
      0%, 56% { transform: translateY(12px) }
      62%, 100% { transform: translateY(0) }
    }

    @keyframes share-settle-4 {
      0%, 78% { transform: translateY(12px) }
      84%, 100% { transform: translateY(0) }
    }

    /* A caption leaves before the next one rises 8px into place. */
    @keyframes share-cap-1 {
      0%, 30% { opacity: 1 }
      34%, 100% { opacity: 0 }
    }

    @keyframes share-cap-2 {
      0%, 34% { opacity: 0; transform: translateY(8px) }
      39%, 52% { opacity: 1; transform: translateY(0) }
      56%, 100% { opacity: 0; transform: translateY(0) }
    }

    @keyframes share-cap-3 {
      0%, 56% { opacity: 0; transform: translateY(8px) }
      61%, 74% { opacity: 1; transform: translateY(0) }
      78%, 100% { opacity: 0; transform: translateY(0) }
    }

    @keyframes share-cap-4 {
      0%, 78% { opacity: 0; transform: translateY(8px) }
      83%, 100% { opacity: 1; transform: translateY(0) }
    }

    /* The step indicator: the steps done fill in white, the current one is
       the gold quarter sliding along. */
    @keyframes share-done {
      0%, 34% { transform: scaleX(0) }
      37%, 56% { transform: scaleX(.25) }
      59%, 78% { transform: scaleX(.5) }
      81%, 100% { transform: scaleX(.75) }
    }

    @keyframes share-now {
      0%, 34% { transform: translateX(0) }
      37%, 56% { transform: translateX(100%) }
      59%, 78% { transform: translateX(200%) }
      81%, 100% { transform: translateX(300%) }
    }

    /* The stage layout. The devices are sized from one height, --dh, which
       fits the screen (with the caption and the indicator under it) and the
       width (phone, the link mark and the window side by side). The same
       rules twice: under the CSS driver and under the script's .stage-js. */
    #share {
      --stage-len: 400vh;
      --dh: min(488px, calc(100vh - var(--nav-h) - 230px), calc((100vw - 150px) / 1.94));
      --ww: calc(var(--dh) * 1.475);
      --ph: var(--dh)
    }

    @media (prefers-reduced-motion: no-preference) and (min-height: 640px) {
      @supports (animation-timeline: view()) {
        #share[data-stage] {
          padding-bottom: 0
        }

        #share[data-stage] .share-stage {
          min-height: calc(100vh - var(--nav-h));
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 24px 0;
          background: radial-gradient(640px 340px at 50% 42%, rgba(139, 92, 246, .2), transparent 70%)
        }

        #share[data-stage] .share-seq {
          grid-template-columns: minmax(0, 1fr);
          margin: 0;
          text-align: center
        }

        #share[data-stage] .share-step {
          grid-area: 1 / 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          background: none;
          border: 0;
          padding: 0
        }

        #share[data-stage] .share-step::before {
          content: none
        }

        #share[data-stage] .share-shots {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 28px;
          padding: 0;
          margin: 0
        }

        #share[data-stage] .share-window {
          flex: none;
          width: var(--ww);
          margin: 0;
          border-radius: 14px
        }

        #share[data-stage] .share-phone {
          --phone-r: 34px;
          --bezel: 8px;
          position: relative;
          flex: none;
          width: calc((var(--ph) - 2 * var(--bezel) - 2px) * .4615 + 2 * var(--bezel) + 2px)
        }

        #share[data-stage] .share-step+.share-step .share-window,
        #share[data-stage] .share-step+.share-step .share-phone {
          box-shadow: none
        }

        #share[data-stage] .share-link {
          display: flex;
          gap: 7px
        }

        #share[data-stage] .share-cap {
          max-width: 46ch;
          margin-top: 26px
        }

        #share[data-stage] .share-cap h3 {
          font-size: 1.375rem;
          font-weight: 600
        }

        #share[data-stage] .share-cap p {
          font-size: 1.06rem
        }

        #share[data-stage] .share-meter {
          display: block
        }
      }

      #share.stage-js {
        padding-bottom: 0
      }

      #share.stage-js .share-stage {
        min-height: calc(100vh - var(--nav-h));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 0;
        background: radial-gradient(640px 340px at 50% 42%, rgba(139, 92, 246, .2), transparent 70%)
      }

      #share.stage-js .share-seq {
        grid-template-columns: minmax(0, 1fr);
        margin: 0;
        text-align: center
      }

      #share.stage-js .share-step {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: none;
        border: 0;
        padding: 0
      }

      #share.stage-js .share-step::before {
        content: none
      }

      #share.stage-js .share-shots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 0;
        margin: 0
      }

      #share.stage-js .share-window {
        flex: none;
        width: var(--ww);
        margin: 0;
        border-radius: 14px
      }

      #share.stage-js .share-phone {
        --phone-r: 34px;
        --bezel: 8px;
        position: relative;
        flex: none;
        width: calc((var(--ph) - 2 * var(--bezel) - 2px) * .4615 + 2 * var(--bezel) + 2px)
      }

      #share.stage-js .share-step+.share-step .share-window,
      #share.stage-js .share-step+.share-step .share-phone {
        box-shadow: none
      }

      #share.stage-js .share-link {
        display: flex;
        gap: 7px
      }

      #share.stage-js .share-cap {
        max-width: 46ch;
        margin-top: 26px
      }

      #share.stage-js .share-cap h3 {
        font-size: 1.375rem;
        font-weight: 600
      }

      #share.stage-js .share-cap p {
        font-size: 1.06rem
      }

      #share.stage-js .share-meter {
        display: block
      }
    }

    .share-link i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold)
    }

    .share-link i:nth-child(2) {
      opacity: .6
    }

    .share-link i:nth-child(3) {
      opacity: .3
    }

    /* Four segments: a white track, the steps done over it, the gold one. */
    .share-meter {
      position: relative;
      width: min(240px, 60%);
      height: 4px;
      margin: 26px auto 0;
      overflow: hidden;
      -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 calc(25% - 6px), transparent calc(25% - 6px) 25%);
      mask-image: repeating-linear-gradient(90deg, #000 0 calc(25% - 6px), transparent calc(25% - 6px) 25%);
      background: rgba(255, 255, 255, .12)
    }

    .share-done,
    .share-now {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0
    }

    .share-done {
      right: 0;
      background: rgba(255, 255, 255, .25);
      transform-origin: 0 50%;
      transform: scaleX(.75)
    }

    .share-now {
      width: 25%;
      background: var(--gold);
      transform: translateX(300%)
    }

    /* Phone width: the window on top at full width, the phone under it, a
       shorter stage. The phone takes the height the window and the caption
       leave, within 160-380px; on a wide but short screen (a narrow desktop
       window) the window narrows too, so the smallest phone still fits. */
    @media(max-width:899px) {
      #share {
        --stage-len: 300vh;
        --wh: min(calc((100vw - 48px) / 1.475), calc(100vh - var(--nav-h) - 410px));
        --ph: clamp(160px, calc(100vh - var(--nav-h) - var(--wh) - 250px), 380px);
        --ww: min(100%, calc((100vh - var(--nav-h) - 410px) * 1.475))
      }
    }

    @media (prefers-reduced-motion: no-preference) and (min-height: 640px) and (max-width: 899px) {
      @supports (animation-timeline: view()) {
        #share[data-stage] .share-shots {
          flex-direction: column-reverse;
          gap: 14px;
          width: 100%
        }

        #share[data-stage] .share-phone {
          --phone-r: 26px;
          --bezel: 6px
        }

        #share[data-stage] .share-link {
          display: none
        }

        #share[data-stage] .share-cap {
          margin-top: 16px
        }

        #share[data-stage] .share-cap h3 {
          font-size: 1.15rem
        }

        #share[data-stage] .share-cap p {
          font-size: .98rem
        }

        #share[data-stage] .share-meter {
          margin-top: 16px
        }
      }

      #share.stage-js .share-shots {
        flex-direction: column-reverse;
        gap: 14px;
        width: 100%
      }

      #share.stage-js .share-phone {
        --phone-r: 26px;
        --bezel: 6px
      }

      #share.stage-js .share-link {
        display: none
      }

      #share.stage-js .share-cap {
        margin-top: 16px
      }

      #share.stage-js .share-cap h3 {
        font-size: 1.15rem
      }

      #share.stage-js .share-cap p {
        font-size: .98rem
      }

      #share.stage-js .share-meter {
        margin-top: 16px
      }
    }

    /* The engine moves stages from 560px of height at phone width; this one
       needs 640px for the window, the phone and the caption at once, so
       below that it stays the strip of cards. */
    @media (max-height: 639px) {
      #share[data-stage] {
        min-height: 0
      }

      #share .stage-sticky {
        position: relative;
        top: auto
      }

      #share [data-stage-layer] {
        animation: none
      }
    }

    /* Everything else: the facts of the old sections, compact. */
    #more .grid {
      text-align: left
    }

    #more .card.wide {
      grid-column: 1 / -1
    }

    #more .card .lede {
      font-size: .98rem;
      max-width: none
    }

    #more .systems {
      justify-content: flex-start;
      margin-top: 18px
    }

    /* The promo video, only when asked for: nothing is fetched before the
       click, and closing it stops the sound. */
    .watch-box video {
      max-width: min(1100px, 100%);
      max-height: 86vh;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      background: #000
    }

    /* ---------- feature grid ---------- */
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 44px
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:600px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: linear-gradient(180deg, var(--panel), rgba(21, 16, 41, .45));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
      transition: transform .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, .5)
    }

    .card p {
      color: var(--muted);
      font-size: .94rem;
      margin: 0
    }

    ul.checks {
      list-style: none;
      padding: 0;
      margin: 22px 0 0
    }

    ul.checks li {
      padding-left: 28px;
      position: relative;
      color: var(--muted);
      margin-bottom: 11px
    }

    ul.checks li::before {
      content: "▸";
      position: absolute;
      left: 6px;
      color: var(--gold);
      font-weight: 700
    }

    ul.checks strong {
      color: var(--text)
    }

    /* ---------- systems ---------- */
    .systems {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 36px
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: .86rem;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }

    .chip:hover {
      color: var(--text);
      border-color: rgba(139, 92, 246, .55);
      background: rgba(139, 92, 246, .12)
    }

    /* ---------- gallery ---------- */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 40px
    }

    @media(max-width:700px) {
      .gallery {
        grid-template-columns: 1fr
      }
    }

    .gallery img {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    /* Android: one phone in portrait beside two in landscape. */
    .gallery.skins {
      grid-template-columns: 1fr 2fr;
      align-items: end
    }

    .gallery.skins .landscapes {
      display: grid;
      gap: 18px
    }

    .gallery.skins .portrait img {
      max-width: 300px;
      margin: 0 auto;
      border-radius: 22px
    }

    @media(max-width:700px) {
      .gallery.skins {
        grid-template-columns: 1fr
      }
    }

    figure {
      margin: 0
    }

    figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    /* ---------- install ---------- */
    .steps {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 44px;
      text-align: left
    }

    @media(max-width:820px) {
      .steps {
        grid-template-columns: 1fr
      }
    }

    .platform-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.4rem;
      letter-spacing: -.02em;
      margin: 52px 0 0;
    }

    .platform-head+.lede {
      margin: 10px auto 0;
      font-size: 1rem;
    }

    .platform-head+.steps,
    .platform-head+.lede+.steps {
      margin-top: 20px;
    }

    .step-n {
      max-width: 120px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: #1a1206;
      font-weight: 800;
      font-size: .9rem;
      margin-bottom: 14px;
    }

    pre {
      background: #05040b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      max-width: 100%;
      margin: 0;
    }

    code {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .85rem;
      color: #c7f0d8
    }

    /* ---------- support ---------- */
    .support {
      background: linear-gradient(135deg, rgba(139, 92, 246, .14), rgba(255, 210, 30, .07));
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 22px;
      padding: 52px 32px;
      text-align: center;
    }

    /* The lede's 60ch box, not just its lines, sits in the middle of the card. */
    .support .lede {
      margin-left: auto;
      margin-right: auto
    }

    /* ---------- footer ---------- */
    footer {
      border-top: 1px solid var(--line);
      padding: 52px 0;
      color: var(--muted);
      font-size: .9rem
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center
    }

    .foot-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap
    }

    .foot-links a {
      color: var(--muted)
    }

    .foot-links a:hover {
      color: var(--text)
    }

    .disclaimer,
    .fineprint {
      margin-top: 26px;
      font-size: .8rem;
      color: #6f688c;
      max-width: 70ch
    }

    .fineprint {
      margin: 28px auto 0
    }

    /* "Shelf" carousel: 3 console shots per slide, dots + wrap-around arrows */
    .carousel {
      position: relative;
      margin-top: 36px
    }

    .carousel-stage {
      position: relative
    }

    .carousel-viewport {
      overflow: hidden
    }

    .carousel-track {
      display: flex;
      transition: transform .45s cubic-bezier(.4, 0, .2, 1);
      will-change: transform
    }

    .carousel-track figure {
      flex: 0 0 33.3333%;
      box-sizing: border-box;
      padding: 0 10px;
      margin: 0
    }

    @media(max-width:820px) {
      .carousel-track figure {
        flex-basis: 100%
      }
    }

    .carousel-track img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    .carousel-track figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    .carousel-btn {
      position: absolute;
      top: 44%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 16, 40, .82);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .92;
      transition: background .15s ease, opacity .15s ease
    }

    .carousel-btn:hover {
      opacity: 1;
      background: rgba(50, 40, 86, .95)
    }

    .carousel-prev {
      left: -8px
    }

    .carousel-next {
      right: -8px
    }

    @media(max-width:560px) {
      .carousel-prev {
        left: 2px
      }

      .carousel-next {
        right: 2px
      }
    }

    .carousel-dots {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin-top: 22px;
      flex-wrap: wrap
    }

    .carousel-dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
      transition: background .2s ease, width .2s ease
    }

    .carousel-dots button.active {
      background: var(--violet);
      width: 24px
    }

    /* <picture> wraps the screenshots for AVIF/WebP (tools/build_site.py);
       it must not add a box of its own to the layout. */
    picture {
      display: contents
    }

    /* Zoomable screenshots -> lightbox */
    .stage-devices img,
    .gallery img,
    .carousel-track img {
      cursor: zoom-in;
      transition: transform .15s ease
    }

    .carousel-track img:hover,
    .gallery img:hover {
      transform: translateY(-3px)
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 4, 16, .9);
      padding: 24px;
      backdrop-filter: blur(4px)
    }

    .lightbox.open {
      display: flex
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .7)
    }

    .lightbox-close {
      position: fixed;
      top: 14px;
      right: 22px;
      width: 44px;
      height: 44px;
      font-size: 1.9rem;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      opacity: .9
    }

    .lightbox-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, .16)
    }

    .lightbox-cap {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #d8d3ea;
      font-size: .9rem;
      pointer-events: none
    }

    /* ---------- phones ---------- */
    @media(max-width:600px) {
      .wrap {
        padding: 0 16px
      }

      section {
        padding: 64px 0
      }

      .card {
        padding: 20px
      }

      .support {
        padding: 36px 20px
      }

      /* Wrap commands at spaces instead of forcing a wide line; the <pre>
         keeps its own scrollbar for the odd unbreakable token. */
      pre {
        white-space: pre-wrap;
        padding: 12px 14px
      }

      code {
        font-size: .8rem
      }

      .lightbox {
        padding: 12px
      }
    }
    /* ---------- language picker ---------- */
    /* A <details> menu of plain links: it opens and works without JavaScript,
       and each entry is the same page in another language. */
    .lang-switch {
      position: relative;
      flex: none
    }

    .lang-switch summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none
    }

    .lang-switch summary::-webkit-details-marker {
      display: none
    }

    .lang-switch summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-2px) rotate(45deg)
    }

    .lang-switch[open] summary::after {
      transform: translateY(2px) rotate(-135deg)
    }

    .lang-switch summary:hover,
    .lang-switch[open] summary {
      background: var(--panel)
    }

    .lang-switch .flag {
      font-size: 1.15rem;
      line-height: 1
    }

    .lang-switch ul {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      margin: 0;
      padding: 6px;
      list-style: none;
      min-width: 210px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
      z-index: 60
    }

    .lang-switch li a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem
    }

    .lang-switch li a:hover {
      background: rgba(255, 255, 255, .06);
      text-decoration: none
    }

    .lang-switch li a[aria-current="page"] {
      background: rgba(139, 92, 246, .22);
      font-weight: 700
    }

    /* On a phone the header holds the brand, Download and the picker: the
       flag alone says which language is on. */
    @media(max-width:560px) {
      .lang-switch .lang-name {
        display: none
      }
    }

    /* The longest link rows (French, German, Portuguese) only fit next to the
       language name on a wide window; below that the flag is enough. */
    @media(max-width:1279px) {
      .lang-switch .lang-name {
        display: none
      }
    }
    /* ---------- cartridge wall ----------
       Four endless belts of real cartridge renders. Each row has its own size,
       speed and direction (smaller, dimmer and slower reads as farther away),
       and page scroll pushes each row sideways by a different amount. The rows
       are built by the script at the end of the page. */
    #cartridges {
      overflow: hidden;
      padding-bottom: 72px
    }

    #cartridges .wrap {
      margin-bottom: 44px
    }

    .cart-wall {
      position: relative;
      display: grid;
      gap: var(--row-gap, 26px);
      padding-block: 18px;
      /* the belts dissolve into the page at both ends instead of being cut */
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .cart-wall::before {
      content: "";
      position: absolute;
      inset: 10% 0;
      background: radial-gradient(60% 50% at 50% 55%, rgba(139, 92, 246, .16), transparent 70%);
      pointer-events: none;
    }

    .belt-row {
      position: relative;
      height: var(--h);
      opacity: var(--depth)
    }

    /* outer layer: scroll parallax (set from JS); inner layer: the endless loop (CSS) */
    .belt-shift {
      height: 100%;
      will-change: transform
    }

    .belt {
      display: flex;
      width: max-content;
      height: 100%;
      animation: belt-left var(--dur) linear infinite;
      will-change: transform
    }

    .belt-row[data-dir="right"] .belt {
      animation-name: belt-right
    }

    .belt-row:hover .belt,
    .cart-wall.is-offscreen .belt {
      animation-play-state: paused
    }

    .belt-set {
      display: flex;
      gap: var(--gap);
      padding-right: var(--gap);
      height: 100%
    }

      flex: none;
      height: 100%;
      width: auto;
      max-width: none;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55));
      transition: transform .25s ease, filter .25s ease
    }

    .belt-row:hover .cart:hover {
      transform: translateY(-6px) scale(1.04);
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .6)) drop-shadow(0 0 18px rgba(139, 92, 246, .35))
    }

    @keyframes belt-left {
      to {
        transform: translateX(-50%)
      }
    }

    @keyframes belt-right {
      from {
        transform: translateX(-50%)
      }

      to {
        transform: translateX(0)
      }
    }

    /* still and scrollable for anyone who asked for less motion */
    @media (prefers-reduced-motion: reduce) {
      .belt-row {
        overflow-x: auto;
        scrollbar-width: none
      }

      .belt {
        animation: none
      }

      .belt-set+.belt-set {
        display: none
      }
    }

    @media (max-width: 600px) {
      .cart-wall {
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%)
      }
    }
  </style>

  <!-- Lightbox: click any screenshot to view it full-size (e-commerce style) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" {{lightbox.label}}
    <button class="lightbox-close" id="lightboxClose" {{lightbox.close}}
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-cap" id="lightboxCap"></div>
  </div>
  <div class="lightbox watch-box" id="watchBox" role="dialog" aria-modal="true" aria-label="{{hero.video_label}}">
    <button class="lightbox-close" id="watchClose" {{lightbox.close}}
    <video id="promoVideo" controls playsinline preload="none" width="1920" height="1080"
      data-src="{{root}}assets/openemux-promo.mp4" data-poster="{{root}}assets/openemux-promo-poster.jpg"></video>
  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightboxImg');
      var cap = document.getElementById('lightboxCap');
      var closeBtn = document.getElementById('lightboxClose');

      function open(src, alt, caption) {
        img.src = src;
        img.alt = alt || '';
        cap.textContent = caption || alt || '';
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        box.classList.remove('open');
        document.body.style.overflow = '';
        img.src = '';
      }

      document.querySelectorAll('.stage-devices img, .gallery img, .carousel-track img').forEach(function (el) {
        el.addEventListener('click', function () {
          var fig = el.closest('figure');
          var caption = fig ? (fig.querySelector('figcaption') || {}).textContent : '';
          open(el.dataset.full || el.currentSrc || el.src, el.alt, caption);
        });
      });

      closeBtn.addEventListener('click', close);
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('open')) close();
      });
    })();

    // Promo video, on demand: the link opens a dialog and only then gives the
    // <video> its source. It starts on that click, except under Save-Data,
    // where it waits for the play button. Closing stops it and drops the
    // source, so nothing keeps downloading.
    (function () {
      var link = document.getElementById('watchVideo');
      var box = document.getElementById('watchBox');
      var video = document.getElementById('promoVideo');
      if (!link || !box || !video) return;
      var closeBtn = document.getElementById('watchClose');
      var conn = navigator.connection || {};

      function open(e) {
        // Ctrl/Cmd/Shift-click still opens the file in a new tab or window.
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button) return;
        e.preventDefault();
        video.poster = video.dataset.poster;
        video.src = video.dataset.src;
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
        if (!conn.saveData) {
          var p = video.play();
          if (p && p.catch) p.catch(function () {});
        }
      }
      function close() {
        if (!box.classList.contains('open')) return;
        video.pause();
        video.removeAttribute('src');
        video.load();
        box.classList.remove('open');
        document.body.style.overflow = '';
        link.focus();
      }

      link.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        // aria-modal: Tab cycles between the close button and the video and
        // never reaches the page under the backdrop.
        else if (e.key === 'Tab') {
          e.preventDefault();
          (document.activeElement === closeBtn ? video : closeBtn).focus();
        }
      });
    })();

    // Shelf carousel: 3 shots per slide (1 on mobile), dots, and wrap-around arrows.
    (function () {
      var root = document.getElementById('shelfCarousel');
      if (!root) return;
      var viewport = root.querySelector('.carousel-viewport');
      var track = root.querySelector('.carousel-track');
      var dotsWrap = root.querySelector('.carousel-dots');
      var prev = root.querySelector('.carousel-prev');
      var next = root.querySelector('.carousel-next');
      var count = track.children.length;
      var page = 0, pages = 1;

      function perView() { return window.matchMedia('(max-width:820px)').matches ? 1 : 3; }

      function render() {
        // Shift by whole viewport widths; clamp the last slide to the end so it
        // always shows a full group of images (no empty trailing slots).
        var maxShift = Math.max(0, track.scrollWidth - viewport.clientWidth);
        var shift = Math.min(page * viewport.clientWidth, maxShift);
        track.style.transform = 'translateX(' + (-shift) + 'px)';
        var dots = dotsWrap.children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === page);
      }

      function go(p) { page = (p % pages + pages) % pages; render(); }  // wrap-around

      function build() {
        pages = Math.ceil(count / perView());
        if (page > pages - 1) page = pages - 1;
        dotsWrap.innerHTML = '';
        for (var i = 0; i < pages; i++) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', {{js.slide}} + (i + 1));
          (function (idx) { b.addEventListener('click', function () { go(idx); }); })(i);
          dotsWrap.appendChild(b);
        }
        render();
      }

      prev.addEventListener('click', function () { go(page - 1); });
      next.addEventListener('click', function () { go(page + 1); });
      var t;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(build, 120); });
      build();
    })();
  </script>

  <script>
    // Cartridge wall: builds the four belts. One set of carts has to be wider
    // than the viewport (plus the scroll drift) or the loop shows its seam, so
    // the set is repeated to fit and rebuilt when the width changes enough.
    (function () {
      var wall = document.getElementById("cartWall");
      if (!wall) return;
      // Cartridge renders are 400 px wide; ratio = width / height.
      var CONSOLES = {
        gba: { ratio: 400 / 230, games: ["alien-ninja-squad", "anime-card-duel", "baseball-bash-kids", "bounce-ball-hero", "bubble-town-pop", "castle-siege-tactics", "cosmic-fox-pilot", "crystal-sword-saga", "desert-raider-kid", "disco-robot-dance", "dragon-egg-ranger", "fire-fist-fury", "gem-mine-mania", "go-kart-galaxy", "hamster-ball-run", "hip-hop-step", "jet-ski-splash", "knight-of-hearts", "laser-ship-omega", "mud-truck-mayhem", "ninja-shadow-path", "pocket-karate-champ", "robot-arena-clash", "ski-slope-slalom", "space-cadet-zero", "street-kick-brawl", "super-kart-turbo", "swamp-witch-house", "tiny-wizard-trail", "zombie-night-out"] },
        sfc: { ratio: 400 / 255, games: ["alien-planet-quest", "ancient-sword-legend", "beach-volley-stars", "blade-of-the-crystal", "boxing-ring-champ", "brawl-city-streets", "bubble-pop-parade", "desert-tank-strike", "dragon-sky-rider", "dungeon-party-quest", "forest-spirit-path", "galaxy-star-patrol", "gem-drop-frenzy", "golf-course-pro", "haunted-manor-night", "jungle-vine-swing", "kart-cup-grand-prix", "magic-boot-hopper", "mecha-pilot-zero", "ninja-twin-strike", "rhythm-drum-party", "robot-man-x", "sky-fortress-siege", "super-kart-buddies", "the-car-racing-game", "the-fighter-game", "time-knight-saga", "turbo-highway-run", "wizard-tower-tales", "zero-grav-speedster"] },
        n64: { ratio: 400 / 257, games: ["bear-bird-buddies", "cloud-glider-pilot", "comet-squadron-zero", "gold-agent-mission", "jungle-island-rescue", "kart-kingdom-cup", "mountain-snow-board", "ocean-wave-racer", "party-board-bash", "super-plumber-man-3d", "the-wrestling-match", "turbo-pod-racer"] },
        md: { ratio: 400 / 271, games: ["barbarian-axe-quest", "coast-road-cruiser", "cyber-ninja-revenge", "funky-alien-groove", "gridiron-smash", "hyper-space-fighter", "jungle-heli-strike", "mutant-tomato-panic", "rage-city-brawl", "sword-force-tactics", "the-fighter-game-ii", "turbo-cheetah-dash"] }
      };
      // Top to bottom. SNES and GBA are the front rows (big, bright, fast);
      // N64 and Mega Drive sit behind them at the edges. speed is px/s at full
      // scale; drift is how far a full pass of page scroll pushes the row sideways.
      var ROWS = [
        { console: "n64", h: 96, speed: 22, dir: "left", depth: .5, drift: 50 },
        { console: "sfc", h: 168, speed: 48, dir: "right", depth: 1, drift: -150 },
        { console: "gba", h: 150, speed: 44, dir: "left", depth: 1, drift: 130 },
        { console: "md", h: 104, speed: 26, dir: "right", depth: .55, drift: -60 }
      ];
      var base = wall.getAttribute("data-base");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var built = [];
      var lastScale = 0;

      function title(slug) {
        return slug.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }

      function build() {
        var vw = document.documentElement.clientWidth;
        var scale = Math.max(.58, Math.min(1, vw / 1280));
        if (Math.abs(scale - lastScale) < .04 && built.length) return;
        lastScale = scale;
        wall.textContent = "";
        built = [];
        wall.style.setProperty("--row-gap", Math.round(26 * scale) + "px");

        ROWS.forEach(function (row, i) {
          var spec = CONSOLES[row.console];
          var h = Math.round(row.h * scale);
          var gap = Math.round(h * .22);
          var itemW = h * spec.ratio + gap;
          var by = (i * 7) % spec.games.length;
          var games = spec.games.slice(by).concat(spec.games.slice(0, by));
          var minW = vw * 1.15 + Math.abs(row.drift) * 2;
          var seq = [];
          while (seq.length * itemW < minW) seq = seq.concat(games);

          var el = document.createElement("div");
          el.className = "belt-row";
          el.setAttribute("data-dir", row.dir);
          el.style.setProperty("--h", h + "px");
          el.style.setProperty("--gap", gap + "px");
          el.style.setProperty("--depth", row.depth);
          el.style.setProperty("--dur", (seq.length * itemW / (row.speed * scale)).toFixed(1) + "s");
          var shift = document.createElement("div");
          shift.className = "belt-shift";
          var belt = document.createElement("div");
          belt.className = "belt";
          for (var copy = 0; copy < 2; copy++) {
            var set = document.createElement("div");
            set.className = "belt-set";
            if (copy) set.setAttribute("aria-hidden", "true");
            seq.forEach(function (slug) {
              var img = document.createElement("img");
              img.className = "cart";
              img.src = base + row.console + "-" + slug + ".webp";
              img.alt = "";
              img.title = title(slug);
              img.width = Math.round(h * spec.ratio);
              img.height = h;
              img.decoding = "async";
              img.draggable = false;
              set.appendChild(img);
            });
            belt.appendChild(set);
          }
          shift.appendChild(belt);
          el.appendChild(shift);
          wall.appendChild(el);
          built.push({ shift: shift, drift: row.drift * scale });
        });
        parallax();
      }

      // -1 when the wall enters at the bottom of the viewport, +1 as it leaves at the top.
      var ticking = false;
      function parallax() {
        ticking = false;
        if (reduceMotion.matches) return;
        var r = wall.getBoundingClientRect();
        var vh = window.innerHeight;
        var p = Math.max(-1, Math.min(1, ((vh - r.top) / (vh + r.height)) * 2 - 1));
        built.forEach(function (b) {
          b.shift.style.transform = "translate3d(" + (p * b.drift).toFixed(1) + "px,0,0)";
        });
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          wall.classList.toggle("is-offscreen", !entries[0].isIntersecting);
        }).observe(wall);
      }
      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(build, 150);
      });
      window.addEventListener("scroll", function () {
        if (!ticking) { ticking = true; requestAnimationFrame(parallax); }
      }, { passive: true });
      build();
    })();
  </script>
  <!-- Scroll stages: the fallback driver (see "scroll stages" in the CSS).
       Browsers with scroll-driven animations need nothing from here but the
       will-change switch; elsewhere this writes each on-screen stage's
       progress into --p. It only reads the scroll position: one passive
       listener, one requestAnimationFrame, nothing that moves the page. -->
  <script>
    (function () {
      var stages = [].slice.call(document.querySelectorAll("[data-stage]"));
      if (!stages.length) return;
      var motion = window.matchMedia(
        "(prefers-reduced-motion: no-preference) and (max-width: 899px) and (min-height: 560px), " +
        "(prefers-reduced-motion: no-preference) and (min-height: 640px)");
      var native = window.CSS && CSS.supports && CSS.supports("animation-timeline: view()");
      var visible = [];
      var ticking = false;
      var js = false;
      var header = document.querySelector("header");

      function navHeight() {
        return header ? header.getBoundingClientRect().height : 0;
      }

      // 0 when the section's top reaches the bottom of the header, 1 when
      // its bottom reaches the bottom of the viewport: the same range as
      // the CSS driver's `contain`.
      function update() {
        ticking = false;
        var top = navHeight();
        var vh = window.innerHeight;
        visible.forEach(function (stage) {
          var r = stage.getBoundingClientRect();
          var travel = r.height - (vh - top);
          var p = travel > 0 ? (top - r.top) / travel : 1;
          stage.style.setProperty("--p", Math.max(0, Math.min(1, p)).toFixed(4));
        });
      }

      function request() {
        if (js && !ticking) { ticking = true; requestAnimationFrame(update); }
      }

      function apply() {
        js = motion.matches && !native;
        stages.forEach(function (stage) { stage.classList.toggle("stage-js", js); });
        if (js) update();
      }

      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            entry.target.classList.toggle("is-active", entry.isIntersecting);
            var i = visible.indexOf(entry.target);
            if (entry.isIntersecting && i < 0) visible.push(entry.target);
            if (!entry.isIntersecting && i >= 0) visible.splice(i, 1);
          });
          request();
        });
        stages.forEach(function (stage) { io.observe(stage); });
      } else {
        // No observer: every stage counts as on screen.
        visible = stages.slice();
        stages.forEach(function (stage) { stage.classList.add("is-active"); });
      }

      if (!native) {
        window.addEventListener("scroll", function () { if (motion.matches) request(); }, { passive: true });
        window.addEventListener("resize", function () { if (motion.matches) request(); });
      }
      if (motion.addEventListener) motion.addEventListener("change", apply);
      apply();
    })();

    // The visitor's own system first among the download buttons: Android
    // and Windows move to the front and take the primary style; anything
    // else keeps the order as written (Linux first).
    (function () {
      var ua = navigator.userAgent;
      var os = /Android/i.test(ua) ? "android" : /Windows/i.test(ua) ? "windows" : "";
      var box = document.getElementById("downloads");
      var mine = os && box && box.querySelector('[data-os="' + os + '"]');
      if (!mine) return;
      [].forEach.call(box.querySelectorAll("[data-os]"), function (btn) {
        btn.classList.toggle("btn-primary", btn === mine);
        btn.classList.toggle("btn-ghost", btn !== mine);
      });
      box.insertBefore(mine, box.firstChild);
    })();
  </script>
