<!DOCTYPE html>
<!-- Generated by tools/build_site.py from site/page.html and site/strings/<locale>.json.
     Edit those and run the script; an edit made here is overwritten, and tests/test_site.py fails on it. -->
<html lang="{{html_lang}}"{{auto_attr}}>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{meta.title}}
  <meta name="description"
    {{meta.description}}
  <link rel="icon" href="{{root}}assets/logo.png" />
  <meta property="og:title" {{meta.og_title}}
  <meta property="og:description"
    {{meta.og_description}}
  <meta property="og:image" content="https://guilhermefeitosa66.github.io/OpenEmux/assets/openemux-library-snes.png" />
  <meta property="og:url" content="{{canonical}}" />
  <link rel="canonical" href="{{canonical}}" />
{{hreflang_links}}
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --bg: #08060f;
      --bg-2: #0e0a1c;
      --panel: #151029;
      --line: rgba(255, 255, 255, .09);
      --violet: #8b5cf6;
      --violet-deep: #5b21b6;
      --gold: #ffd21e;
      --text: #f4f1ff;
      --muted: #a9a2c4;
      --radius: 18px;
      --maxw: 1140px;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      /* Safety net: nothing may widen the document past the viewport on phones.
         `clip` (not `hidden`) keeps the sticky header working. */
      overflow-x: clip;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Cantarell, "Noto Sans", sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block
    }

    a {
      color: var(--gold);
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px
    }

    /* Grid items default to `min-width: auto`, so a child that cannot wrap
       (a <pre> line, a long URL) pushes its column wider than the track and
       drags the whole document past the viewport. */
    .grid>*,
    .steps>*,
    .split>*,
    .gallery>*,
    .carousel-track>* {
      min-width: 0
    }

    section {
      padding: 96px 0;
      border-top: 1px solid var(--line)
    }

    h2 {
      font-size: clamp(1.9rem, 3.6vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -.02em;
      margin: 0 0 14px
    }

    h3 {
      font-size: 1.1rem;
      margin: 0 0 6px;
      letter-spacing: -.01em
    }

    p {
      margin: 0 0 16px
    }

    .lede {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 60ch
    }

    .center {
      text-align: center
    }

    .center .lede {
      margin-left: auto;
      margin-right: auto
    }

    .eyebrow {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* ---------- nav ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8, 6, 15, .72);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 64px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -.02em
    }

    .brand:hover {
      text-decoration: none
    }

    .brand img {
      width: 30px;
      height: 30px
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      gap: 20px;
      align-items: center
    }

    .nav-links a {
      color: var(--muted);
      font-size: .92rem;
      font-weight: 500;
      white-space: nowrap
    }

    .nav-links a:hover {
      color: var(--text);
      text-decoration: none
    }

    /* The full link row needs up to ~1100px next to the brand (French is the
       longest); collapse it before that, or the links wrap onto two lines and
       the Download button is pushed past the viewport edge. */
    @media(max-width:1099px) {
      .nav-links a:not(.btn) {
        display: none
      }
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border-radius: 999px;
      font-weight: 650;
      font-size: .95rem;
      border: 1px solid transparent;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover {
      text-decoration: none;
      transform: translateY(-2px)
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
      box-shadow: 0 10px 34px rgba(139, 92, 246, .42);
    }

    .btn-primary:hover {
      box-shadow: 0 16px 44px rgba(139, 92, 246, .58)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .05);
      border-color: var(--line);
      color: var(--text)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .1)
    }

    .btn-sm {
      padding: 9px 18px;
      font-size: .87rem
    }

    /* ---------- hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      border-top: 0;
      padding: 104px 0 0;
      background:
        radial-gradient(900px 460px at 50% -8%, rgba(139, 92, 246, .4), transparent 68%),
        radial-gradient(600px 380px at 88% 12%, rgba(255, 210, 30, .1), transparent 62%),
        linear-gradient(180deg, var(--bg-2), var(--bg) 78%);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .5;
      pointer-events: none;
      background-image:
        radial-gradient(1.4px 1.4px at 12% 22%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 28% 68%, #d8c8ff, transparent),
        radial-gradient(1.6px 1.6px at 44% 14%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 62% 52%, #ffe9a8, transparent),
        radial-gradient(1.5px 1.5px at 76% 26%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 88% 62%, #cdb8ff, transparent),
        radial-gradient(1.3px 1.3px at 8% 78%, #fff, transparent),
        radial-gradient(1.1px 1.1px at 54% 84%, #fff, transparent);
    }

    .hero-inner {
      position: relative;
      text-align: center
    }

    /* Announcement pill above the headline — carries whatever is new this
       release without touching the h1. */
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 18px 7px 9px;
      margin: 0 0 22px;
      border-radius: 999px;
      background: rgba(139, 92, 246, .13);
      border: 1px solid rgba(139, 92, 246, .42);
      color: var(--text);
      font-size: .88rem;
      font-weight: 600;
    }

    .hero-pill:hover {
      text-decoration: none;
      background: rgba(139, 92, 246, .22);
      border-color: rgba(139, 92, 246, .7);
    }

    .beta {
      flex: none;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255, 210, 30, .13);
      border: 1px solid rgba(255, 210, 30, .4);
      border-radius: 999px;
      padding: 4px 10px;
      line-height: 1;
    }

    .hero-logo {
      width: 118px;
      height: 118px;
      margin: 0 auto 12px;
      filter: drop-shadow(0 18px 40px rgba(139, 92, 246, .55))
    }

    .hero-name {
      margin: 0 0 24px;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text)
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      line-height: 1.04;
      letter-spacing: -.035em;
      margin: 0 0 20px;
      font-weight: 800;
    }

    .hero h1 .grad {
      background: linear-gradient(100deg, #c4b5fd, #fff 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.lede {
      margin: 0 auto 32px;
      font-size: 1.18rem
    }

    .cta {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap
    }

    .cta-note {
      margin-top: 16px;
      font-size: .85rem;
      color: var(--muted)
    }

    .shot {
      margin: 64px auto -110px;
      max-width: 1000px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 50px 120px rgba(0, 0, 0, .75), 0 0 0 1px rgba(139, 92, 246, .16);
    }

    .shot-video {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #08060f;
    }

    .shot-video video {
      display: block;
      width: 100%;
      height: 100%;
    }

    .video-controls {
      position: absolute;
      right: 16px;
      bottom: 16px;
      display: flex;
      gap: 10px;
    }

    .video-controls[hidden] {
      display: none
    }

    .vbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .22);
      background: rgba(8, 6, 15, .72);
      backdrop-filter: blur(8px);
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }

    .vbtn:hover {
      background: rgba(139, 92, 246, .35);
      border-color: rgba(139, 92, 246, .8)
    }

    .vbtn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px
    }

    .vbtn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .vbtn .i-play {
      fill: currentColor
    }

    /* The sound button is the one people are invited to press: gold, with
       its label, until the sound is on. */
    .vbtn-sound {
      padding: 0 18px 0 14px;
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1300
    }

    .vbtn-sound:hover {
      background: #ffe066;
      border-color: #ffe066
    }

    .vbtn-sound[aria-pressed="true"] {
      background: rgba(8, 6, 15, .72);
      border-color: rgba(255, 255, 255, .22);
      color: var(--text)
    }

    #promoPlay .i-play,
    #promoPlay.paused .i-pause,
    .vbtn-sound .i-sound,
    .vbtn-sound[aria-pressed="true"] .i-muted {
      display: none
    }

    #promoPlay.paused .i-play,
    .vbtn-sound[aria-pressed="true"] .i-sound {
      display: block
    }

    /* On a phone the video is too short to carry buttons over it: they move
       to a strip of their own underneath. */
    @media(max-width:560px) {
      .shot-video {
        aspect-ratio: auto
      }

      .shot-video video {
        height: auto;
        aspect-ratio: 16 / 9
      }

      .video-controls {
        position: static;
        justify-content: flex-end;
        padding: 10px;
        border-top: 1px solid rgba(255, 255, 255, .1)
      }

      .vbtn-sound span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0)
      }

      .vbtn-sound {
        padding: 0 12px
      }
    }

    .hero-pad {
      height: 130px
    }

    /* ---------- feature grid ---------- */
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 44px
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:600px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: linear-gradient(180deg, var(--panel), rgba(21, 16, 41, .45));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
      transition: transform .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, .5)
    }

    .card p {
      color: var(--muted);
      font-size: .94rem;
      margin: 0
    }

    .ico {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: rgba(139, 92, 246, .16);
      border: 1px solid rgba(139, 92, 246, .32);
      margin-bottom: 16px;
      font-size: 1.25rem;
    }

    /* ---------- split ---------- */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center
    }

    @media(max-width:860px) {
      .split {
        grid-template-columns: 1fr;
        gap: 36px
      }
    }

    .split img,
    .frame {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
    }

    ul.checks {
      list-style: none;
      padding: 0;
      margin: 22px 0 0
    }

    ul.checks li {
      padding-left: 28px;
      position: relative;
      color: var(--muted);
      margin-bottom: 11px
    }

    ul.checks li::before {
      content: "▸";
      position: absolute;
      left: 6px;
      color: var(--gold);
      font-weight: 700
    }

    ul.checks strong {
      color: var(--text)
    }

    /* ---------- systems ---------- */
    .systems {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 36px
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: .86rem;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }

    .chip:hover {
      color: var(--text);
      border-color: rgba(139, 92, 246, .55);
      background: rgba(139, 92, 246, .12)
    }

    /* ---------- gallery ---------- */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 40px
    }

    @media(max-width:700px) {
      .gallery {
        grid-template-columns: 1fr
      }
    }

    .gallery img {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    .gallery.thirds {
      grid-template-columns: repeat(3, 1fr)
    }

    @media(max-width:700px) {
      .gallery.thirds {
        grid-template-columns: 1fr
      }
    }

    /* Android: phone screens, four to a row (two on a phone) */
    .gallery.phones {
      grid-template-columns: repeat(4, 1fr)
    }

    @media(max-width:700px) {
      .gallery.phones {
        grid-template-columns: 1fr 1fr
      }
    }

    .gallery.phones img {
      border-radius: 22px
    }

    figure {
      margin: 0
    }

    figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    /* ---------- install ---------- */
    /* Without JavaScript: every platform stacked under its heading, every
       package under its gold tag. With it (`.tabs-on` on the section): two
       rows of tabs and one panel at a time. */
    #install [hidden] {
      display: none !important
    }

    .install-tabs {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      margin-top: 40px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      max-width: 100%;
    }

    .install-tabs button,
    .format-tabs button {
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .install-tabs button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 24px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: .95rem;
    }

    .install-tabs button:hover {
      color: var(--text)
    }

    .install-tabs button[aria-selected="true"] {
      background: linear-gradient(135deg, var(--violet), var(--violet-deep));
      color: #fff;
    }

    .format-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
    }

    .format-tabs button {
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      color: var(--text);
      font-size: .9rem;
    }

    .format-tabs button:hover {
      border-color: rgba(255, 210, 30, .5)
    }

    .format-tabs button[aria-selected="true"] {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1206;
      font-weight: 800;
    }

    .install-tabs button:focus-visible,
    .format-tabs button:focus-visible,
    .install-panel:focus-visible,
    .format-panel:focus-visible,
    .verify summary:focus-visible,
    .copy:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .install-panel {
      max-width: 860px;
      margin: 0 auto;
      border-radius: var(--radius);
    }

    .install-card {
      margin-top: 20px;
      text-align: left;
    }

    .install-card:hover {
      transform: none;
      border-color: var(--line)
    }

    .tabs-on .install-panel {
      margin-top: 24px
    }

    .tabs-on .platform-head,
    .tabs-on .format-tag {
      display: none
    }

    .tabs-on .install-panel>.lede {
      margin-top: 0
    }

    .platform-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.4rem;
      letter-spacing: -.02em;
      margin: 52px 0 0;
    }

    .install-panel>.lede {
      margin: 10px auto 0;
      font-size: 1rem;
    }

    .format-panel {
      border-radius: 10px
    }

    .format-panel+.format-panel {
      margin-top: 40px
    }

    .tabs-on .format-panel+.format-panel {
      margin-top: 0
    }

    .format-tag {
      display: inline-block;
      border-radius: 8px;
      padding: 3px 12px;
      background: var(--gold);
      color: #1a1206;
      font-weight: 800;
      font-size: .9rem;
      margin-bottom: 14px;
    }

    .format-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
    }

    .format-head h3 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: -.02em;
    }

    #install .note {
      color: var(--muted);
      font-size: .88rem;
    }

    #install .note p {
      margin: 10px 0 0
    }

    .format-head .note p {
      margin-top: 2px
    }

    .format-panel>.note p {
      margin: 22px 0 10px
    }

    .dl-icon {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .install-steps {
      list-style: none;
      counter-reset: step;
      margin: 26px 0 0;
      padding: 0;
      display: grid;
      gap: 22px;
    }

    .install-steps>li {
      counter-increment: step;
      position: relative;
      padding-left: 46px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .install-steps>li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: #1a1206;
      font-weight: 800;
      font-size: .9rem;
    }

    .install-steps>li>p,
    .install-steps>li>h3 {
      margin: 2px 0 10px;
      color: var(--text);
    }

    .install-steps>li>h3 {
      font-size: 1rem
    }

    .install-steps>li>p:last-child {
      margin-bottom: 0
    }

    /* A command and its copy button. The button keeps its own corner, so
       the text never runs under it; long lines wrap inside the box. */
    .cmd {
      position: relative
    }

    .cmd pre {
      padding-right: 104px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .copy {
      position: absolute;
      top: 8px;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      max-width: 88px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      font: inherit;
      font-size: .78rem;
      font-weight: 650;
      line-height: 1.2;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .copy:hover {
      background: rgba(255, 255, 255, .12)
    }

    .copy.done {
      background: #c7f0d8;
      border-color: #c7f0d8;
      color: #0b2a18;
    }

    .copy svg {
      width: 14px;
      height: 14px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .verify {
      max-width: 860px;
      margin: 18px auto 0;
      padding: 0 22px;
      text-align: left;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .verify[open] {
      padding-bottom: 20px
    }

    .verify summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 12px 0;
      cursor: pointer;
      list-style: none;
      border-radius: 8px;
    }

    .verify summary::-webkit-details-marker {
      display: none
    }

    .verify summary::after {
      content: "";
      margin-left: auto;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform .15s ease;
    }

    .verify[open] summary::after {
      transform: rotate(-135deg)
    }

    .verify summary h3 {
      margin: 0;
      font-size: 1rem;
    }

    .verify-icon {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .verify>p {
      margin: 6px 0 10px;
      font-size: .92rem;
    }

    .verify .note p {
      margin: 10px 0 16px
    }

    .all-files {
      margin: 30px 0 0;
      font-weight: 650;
    }

    .all-files+.lede {
      margin-top: 18px;
      font-size: 1rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media(max-width:560px) {
      .install-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
        gap: 4px;
        padding: 4px;
        margin-top: 28px;
      }

      .install-tabs button {
        flex-direction: column;
        gap: 3px;
        padding: 8px 4px;
        font-size: .88rem;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .install-tabs .beta {
        padding: 2px 6px;
        font-size: .58rem;
      }

      .format-head .btn {
        width: 100%;
        justify-content: center;
      }

      .install-steps>li {
        padding-left: 40px
      }

      .verify {
        padding: 0 16px
      }

      .cmd pre {
        padding-right: 14px;
        padding-top: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .install-tabs button,
      .format-tabs button,
      .copy,
      .verify summary::after {
        transition: none
      }
    }

    pre {
      background: #05040b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      max-width: 100%;
      margin: 0;
    }

    code {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .85rem;
      color: #c7f0d8
    }

    /* ---------- support ---------- */
    .support {
      background: linear-gradient(135deg, rgba(139, 92, 246, .14), rgba(255, 210, 30, .07));
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 22px;
      padding: 52px 32px;
      text-align: center;
    }

    /* The lede's 60ch box, not just its lines, sits in the middle of the card. */
    .support .lede {
      margin-left: auto;
      margin-right: auto
    }

    /* ---------- footer ---------- */
    footer {
      border-top: 1px solid var(--line);
      padding: 52px 0;
      color: var(--muted);
      font-size: .9rem
    }

    .foot {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center
    }

    .foot-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap
    }

    .foot-links a {
      color: var(--muted)
    }

    .foot-links a:hover {
      color: var(--text)
    }

    .disclaimer,
    .fineprint {
      margin-top: 26px;
      font-size: .8rem;
      color: #6f688c;
      max-width: 70ch
    }

    .fineprint {
      margin: 28px auto 0
    }

    /* "Shelf" carousel: 3 console shots per slide, dots + wrap-around arrows */
    .carousel {
      position: relative;
      margin-top: 36px
    }

    .carousel-stage {
      position: relative
    }

    .carousel-viewport {
      overflow: hidden
    }

    .carousel-track {
      display: flex;
      transition: transform .45s cubic-bezier(.4, 0, .2, 1);
      will-change: transform
    }

    .carousel-track figure {
      flex: 0 0 33.3333%;
      box-sizing: border-box;
      padding: 0 10px;
      margin: 0
    }

    @media(max-width:820px) {
      .carousel-track figure {
        flex-basis: 100%
      }
    }

    .carousel-track img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5)
    }

    .carousel-track figcaption {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 10px;
      text-align: center
    }

    .carousel-btn {
      position: absolute;
      top: 44%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 16, 40, .82);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .92;
      transition: background .15s ease, opacity .15s ease
    }

    .carousel-btn:hover {
      opacity: 1;
      background: rgba(50, 40, 86, .95)
    }

    .carousel-prev {
      left: -8px
    }

    .carousel-next {
      right: -8px
    }

    @media(max-width:560px) {
      .carousel-prev {
        left: 2px
      }

      .carousel-next {
        right: 2px
      }
    }

    .carousel-dots {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin-top: 22px;
      flex-wrap: wrap
    }

    .carousel-dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: var(--line);
      cursor: pointer;
      transition: background .2s ease, width .2s ease
    }

    .carousel-dots button.active {
      background: var(--violet);
      width: 24px
    }

    /* Zoomable screenshots -> lightbox */
    .shot img,
    .gallery img,
    .split img,
    .carousel-track img {
      cursor: zoom-in;
      transition: transform .15s ease
    }

    .carousel-track img:hover,
    .gallery img:hover {
      transform: translateY(-3px)
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 4, 16, .9);
      padding: 24px;
      backdrop-filter: blur(4px)
    }

    .lightbox.open {
      display: flex
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .7)
    }

    .lightbox-close {
      position: fixed;
      top: 14px;
      right: 22px;
      width: 44px;
      height: 44px;
      font-size: 1.9rem;
      line-height: 1;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      opacity: .9
    }

    .lightbox-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, .16)
    }

    .lightbox-cap {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #d8d3ea;
      font-size: .9rem;
      pointer-events: none
    }

    /* ---------- phones ---------- */
    @media(max-width:600px) {
      .wrap {
        padding: 0 16px
      }

      section {
        padding: 64px 0
      }

      .card {
        padding: 20px
      }

      .support {
        padding: 36px 20px
      }

      /* Wrap commands at spaces instead of forcing a wide line; the <pre>
         keeps its own scrollbar for the odd unbreakable token. */
      pre {
        white-space: pre-wrap;
        padding: 12px 14px
      }

      code {
        font-size: .8rem
      }

      .lightbox {
        padding: 12px
      }
    }
    /* ---------- language picker ---------- */
    /* A <details> menu of plain links: it opens and works without JavaScript,
       and each entry is the same page in another language. */
    .lang-switch {
      position: relative;
      flex: none
    }

    .lang-switch summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none
    }

    .lang-switch summary::-webkit-details-marker {
      display: none
    }

    .lang-switch summary::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-2px) rotate(45deg)
    }

    .lang-switch[open] summary::after {
      transform: translateY(2px) rotate(-135deg)
    }

    .lang-switch summary:hover,
    .lang-switch[open] summary {
      background: var(--panel)
    }

    .lang-switch .flag {
      font-size: 1.15rem;
      line-height: 1
    }

    .lang-switch ul {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      margin: 0;
      padding: 6px;
      list-style: none;
      min-width: 210px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
      z-index: 60
    }

    .lang-switch li a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem
    }

    .lang-switch li a:hover {
      background: rgba(255, 255, 255, .06);
      text-decoration: none
    }

    .lang-switch li a[aria-current="page"] {
      background: rgba(139, 92, 246, .22);
      font-weight: 700
    }

    /* On a phone the header holds the brand, Download and the picker: the
       flag alone says which language is on. */
    @media(max-width:560px) {
      .lang-switch .lang-name {
        display: none
      }
    }

    /* The longest link rows (French, German, Portuguese) only fit next to the
       language name on a wide window; below that the flag is enough. */
    @media(max-width:1279px) {
      .lang-switch .lang-name {
        display: none
      }
    }
    /* ---------- cartridge wall ----------
       Four endless belts of real cartridge renders. Each row has its own size,
       speed and direction (smaller, dimmer and slower reads as farther away),
       and page scroll pushes each row sideways by a different amount. The rows
       are built by the script at the end of the page. */
    #cartridges {
      overflow: hidden;
      padding-bottom: 72px
    }

    #cartridges .wrap {
      margin-bottom: 44px
    }

    .cart-wall {
      position: relative;
      display: grid;
      gap: var(--row-gap, 26px);
      padding-block: 18px;
      /* the belts dissolve into the page at both ends instead of being cut */
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 16%, #000 84%, transparent 100%);
    }

    .cart-wall::before {
      content: "";
      position: absolute;
      inset: 10% 0;
      background: radial-gradient(60% 50% at 50% 55%, rgba(139, 92, 246, .16), transparent 70%);
      pointer-events: none;
    }

    .belt-row {
      position: relative;
      height: var(--h);
      opacity: var(--depth)
    }

    /* outer layer: scroll parallax (set from JS); inner layer: the endless loop (CSS) */
    .belt-shift {
      height: 100%;
      will-change: transform
    }

    .belt {
      display: flex;
      width: max-content;
      height: 100%;
      animation: belt-left var(--dur) linear infinite;
      will-change: transform
    }

    .belt-row[data-dir="right"] .belt {
      animation-name: belt-right
    }

    .belt-row:hover .belt,
    .cart-wall.is-offscreen .belt {
      animation-play-state: paused
    }

    .belt-set {
      display: flex;
      gap: var(--gap);
      padding-right: var(--gap);
      height: 100%
    }

    .cart {
      flex: none;
      height: 100%;
      width: auto;
      max-width: none;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55));
      transition: transform .25s ease, filter .25s ease
    }

    .belt-row:hover .cart:hover {
      transform: translateY(-6px) scale(1.04);
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .6)) drop-shadow(0 0 18px rgba(139, 92, 246, .35))
    }

    @keyframes belt-left {
      to {
        transform: translateX(-50%)
      }
    }

    @keyframes belt-right {
      from {
        transform: translateX(-50%)
      }

      to {
        transform: translateX(0)
      }
    }

    /* still and scrollable for anyone who asked for less motion */
    @media (prefers-reduced-motion: reduce) {
      .belt-row {
        overflow-x: auto;
        scrollbar-width: none
      }

      .belt {
        animation: none
      }

      .belt-set+.belt-set {
        display: none
      }
    }

    @media (max-width: 600px) {
      .cart-wall {
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%)
      }
    }
  </style>
  <script src="{{root}}lang.js"></script>
</head>

  <!-- Lightbox: click any screenshot to view it full-size (e-commerce style) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" {{lightbox.label}}

    <img id="lightboxImg" src="" alt="" />

  </div>
  <script>
    (function () {
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightboxImg');
      var cap = document.getElementById('lightboxCap');
      var closeBtn = document.getElementById('lightboxClose');

      function open(src, alt, caption) {
        img.src = src;
        img.alt = alt || '';
        cap.textContent = caption || alt || '';
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        box.classList.remove('open');
        document.body.style.overflow = '';
        img.src = '';
      }

      document.querySelectorAll('.shot img, .gallery img, .split img, .carousel-track img').forEach(function (el) {
        el.addEventListener('click', function () {
          var fig = el.closest('figure');
          var caption = fig ? (fig.querySelector('figcaption') || {}).textContent : '';
          open(el.currentSrc || el.src, el.alt, caption);
        });
      });

      closeBtn.addEventListener('click', close);
      box.addEventListener('click', function (e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && box.classList.contains('open')) close();
      });
    })();

    // Promo video in the hero. Browsers only autoplay muted video, so it starts
    // silent and the gold button turns the sound on -- from the top, so the
    // music starts with the intro. It plays only while on screen, and never on
    // its own for reduced motion or Save-Data.
    (function () {
      var video = document.getElementById('promoVideo');
      if (!video) return;
      var controls = video.parentNode.querySelector('.video-controls');
      var playBtn = document.getElementById('promoPlay');
      var soundBtn = document.getElementById('promoSound');
      var soundLabel = soundBtn.querySelector('span');
      var conn = navigator.connection || {};
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches || conn.saveData;
      var userPaused = still;
      var visible = false;

      video.removeAttribute('controls');
      controls.hidden = false;

      function sync() {
        var paused = video.paused;
        playBtn.classList.toggle('paused', paused);
        playBtn.setAttribute('aria-label', paused ? playBtn.dataset.play : playBtn.dataset.pause);
        soundBtn.setAttribute('aria-pressed', video.muted ? 'false' : 'true');
        soundLabel.textContent = video.muted ? soundBtn.dataset.on : soundBtn.dataset.off;
      }

      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(sync);
      }

      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          visible = entries[0].isIntersecting;
          if (visible && !userPaused) play();
          else if (!visible && !video.paused) video.pause();
        }, { threshold: .35 }).observe(video);
      } else if (!userPaused) {
        play();
      }

      playBtn.addEventListener('click', function () {
        if (video.paused) { userPaused = false; play(); }
        else { userPaused = true; video.pause(); }
      });

      soundBtn.addEventListener('click', function () {
        if (video.muted) {
          video.muted = false;
          video.currentTime = 0;
          userPaused = false;
          play();
        } else {
          video.muted = true;
        }
        sync();
      });

      video.addEventListener('play', sync);
      video.addEventListener('pause', sync);
      sync();
    })();

    // Shelf carousel: 3 shots per slide (1 on mobile), dots, and wrap-around arrows.
    (function () {
      var root = document.getElementById('shelfCarousel');
      if (!root) return;
      var viewport = root.querySelector('.carousel-viewport');
      var track = root.querySelector('.carousel-track');
      var dotsWrap = root.querySelector('.carousel-dots');
      var prev = root.querySelector('.carousel-prev');
      var next = root.querySelector('.carousel-next');
      var count = track.children.length;
      var page = 0, pages = 1;

      function perView() { return window.matchMedia('(max-width:820px)').matches ? 1 : 3; }

      function render() {
        // Shift by whole viewport widths; clamp the last slide to the end so it
        // always shows a full group of images (no empty trailing slots).
        var maxShift = Math.max(0, track.scrollWidth - viewport.clientWidth);
        var shift = Math.min(page * viewport.clientWidth, maxShift);
        track.style.transform = 'translateX(' + (-shift) + 'px)';
        var dots = dotsWrap.children;
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === page);
      }

      function go(p) { page = (p % pages + pages) % pages; render(); }  // wrap-around

      function build() {
        pages = Math.ceil(count / perView());
        if (page > pages - 1) page = pages - 1;
        dotsWrap.innerHTML = '';
        for (var i = 0; i < pages; i++) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', {{js.slide}} + (i + 1));
          (function (idx) { b.addEventListener('click', function () { go(idx); }); })(i);
          dotsWrap.appendChild(b);
        }
        render();
      }

      prev.addEventListener('click', function () { go(page - 1); });
      next.addEventListener('click', function () { go(page + 1); });
      var t;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(build, 120); });
      build();
    })();
  </script>

  <script>
    // Cartridge wall: builds the four belts. One set of carts has to be wider
    // than the viewport (plus the scroll drift) or the loop shows its seam, so
    // the set is repeated to fit and rebuilt when the width changes enough.
    (function () {
      var wall = document.getElementById("cartWall");
      if (!wall) return;
      // Cartridge renders are 400 px wide; ratio = width / height.
      var CONSOLES = {
        gba: { ratio: 400 / 230, games: ["alien-ninja-squad", "anime-card-duel", "baseball-bash-kids", "bounce-ball-hero", "bubble-town-pop", "castle-siege-tactics", "cosmic-fox-pilot", "crystal-sword-saga", "desert-raider-kid", "disco-robot-dance", "dragon-egg-ranger", "fire-fist-fury", "gem-mine-mania", "go-kart-galaxy", "hamster-ball-run", "hip-hop-step", "jet-ski-splash", "knight-of-hearts", "laser-ship-omega", "mud-truck-mayhem", "ninja-shadow-path", "pocket-karate-champ", "robot-arena-clash", "ski-slope-slalom", "space-cadet-zero", "street-kick-brawl", "super-kart-turbo", "swamp-witch-house", "tiny-wizard-trail", "zombie-night-out"] },
        sfc: { ratio: 400 / 255, games: ["alien-planet-quest", "ancient-sword-legend", "beach-volley-stars", "blade-of-the-crystal", "boxing-ring-champ", "brawl-city-streets", "bubble-pop-parade", "desert-tank-strike", "dragon-sky-rider", "dungeon-party-quest", "forest-spirit-path", "galaxy-star-patrol", "gem-drop-frenzy", "golf-course-pro", "haunted-manor-night", "jungle-vine-swing", "kart-cup-grand-prix", "magic-boot-hopper", "mecha-pilot-zero", "ninja-twin-strike", "rhythm-drum-party", "robot-man-x", "sky-fortress-siege", "super-kart-buddies", "the-car-racing-game", "the-fighter-game", "time-knight-saga", "turbo-highway-run", "wizard-tower-tales", "zero-grav-speedster"] },
        n64: { ratio: 400 / 257, games: ["bear-bird-buddies", "cloud-glider-pilot", "comet-squadron-zero", "gold-agent-mission", "jungle-island-rescue", "kart-kingdom-cup", "mountain-snow-board", "ocean-wave-racer", "party-board-bash", "super-plumber-man-3d", "the-wrestling-match", "turbo-pod-racer"] },
        md: { ratio: 400 / 271, games: ["barbarian-axe-quest", "coast-road-cruiser", "cyber-ninja-revenge", "funky-alien-groove", "gridiron-smash", "hyper-space-fighter", "jungle-heli-strike", "mutant-tomato-panic", "rage-city-brawl", "sword-force-tactics", "the-fighter-game-ii", "turbo-cheetah-dash"] }
      };
      // Top to bottom. SNES and GBA are the front rows (big, bright, fast);
      // N64 and Mega Drive sit behind them at the edges. speed is px/s at full
      // scale; drift is how far a full pass of page scroll pushes the row sideways.
      var ROWS = [
        { console: "n64", h: 96, speed: 22, dir: "left", depth: .5, drift: 50 },
        { console: "sfc", h: 168, speed: 48, dir: "right", depth: 1, drift: -150 },
        { console: "gba", h: 150, speed: 44, dir: "left", depth: 1, drift: 130 },
        { console: "md", h: 104, speed: 26, dir: "right", depth: .55, drift: -60 }
      ];
      var base = wall.getAttribute("data-base");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var built = [];
      var lastScale = 0;

      function title(slug) {
        return slug.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }

      function build() {
        var vw = document.documentElement.clientWidth;
        var scale = Math.max(.58, Math.min(1, vw / 1280));
        if (Math.abs(scale - lastScale) < .04 && built.length) return;
        lastScale = scale;
        wall.textContent = "";
        built = [];
        wall.style.setProperty("--row-gap", Math.round(26 * scale) + "px");

        ROWS.forEach(function (row, i) {
          var spec = CONSOLES[row.console];
          var h = Math.round(row.h * scale);
          var gap = Math.round(h * .22);
          var itemW = h * spec.ratio + gap;
          var by = (i * 7) % spec.games.length;
          var games = spec.games.slice(by).concat(spec.games.slice(0, by));
          var minW = vw * 1.15 + Math.abs(row.drift) * 2;
          var seq = [];
          while (seq.length * itemW < minW) seq = seq.concat(games);

          var el = document.createElement("div");
          el.className = "belt-row";
          el.setAttribute("data-dir", row.dir);
          el.style.setProperty("--h", h + "px");
          el.style.setProperty("--gap", gap + "px");
          el.style.setProperty("--depth", row.depth);
          el.style.setProperty("--dur", (seq.length * itemW / (row.speed * scale)).toFixed(1) + "s");
          var shift = document.createElement("div");
          shift.className = "belt-shift";
          var belt = document.createElement("div");
          belt.className = "belt";
          for (var copy = 0; copy < 2; copy++) {
            var set = document.createElement("div");
            set.className = "belt-set";
            if (copy) set.setAttribute("aria-hidden", "true");
            seq.forEach(function (slug) {
              var img = document.createElement("img");
              img.className = "cart";
              img.src = base + row.console + "-" + slug + ".webp";
              img.alt = "";
              img.title = title(slug);
              img.width = Math.round(h * spec.ratio);
              img.height = h;
              img.decoding = "async";
              img.draggable = false;
              set.appendChild(img);
            });
            belt.appendChild(set);
          }
          shift.appendChild(belt);
          el.appendChild(shift);
          wall.appendChild(el);
          built.push({ shift: shift, drift: row.drift * scale });
        });
        parallax();
      }

      // -1 when the wall enters at the bottom of the viewport, +1 as it leaves at the top.
      var ticking = false;
      function parallax() {
        ticking = false;
        if (reduceMotion.matches) return;
        var r = wall.getBoundingClientRect();
        var vh = window.innerHeight;
        var p = Math.max(-1, Math.min(1, ((vh - r.top) / (vh + r.height)) * 2 - 1));
        built.forEach(function (b) {
          b.shift.style.transform = "translate3d(" + (p * b.drift).toFixed(1) + "px,0,0)";
        });
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          wall.classList.toggle("is-offscreen", !entries[0].isIntersecting);
        }).observe(wall);
      }
      var resizeTimer;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(build, 150);
      });
      window.addEventListener("scroll", function () {
        if (!ticking) { ticking = true; requestAnimationFrame(parallax); }
      }, { passive: true });
      build();
    })();
  </script>
  <script>
    // Install section (issue 689): tabs, the visitor's platform picked,
    // a copy button on every command, and the download buttons pointed at the
    // files of the latest release. Each part fails quietly to the page as
    // written: every panel visible, links to the Releases page.
    (function () {
      var section = document.getElementById("install");
      if (!section) return;
      var ua = navigator.userAgent;

      // ---- tabs: roving tabindex, arrows/Home/End move and select ----
      var uid = 0;
      function tablist(list, panelOf, onSelect) {
        var tabs = [].slice.call(list.querySelectorAll("[data-tab]"));
        list.setAttribute("role", "tablist");
        tabs.forEach(function (tab) {
          var panel = panelOf(tab.getAttribute("data-tab"));
          var id = "install-tab-" + (++uid);
          tab.id = id;
          tab.setAttribute("role", "tab");
          panel.id = panel.id || id + "-panel";
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", id);
          panel.tabIndex = 0;
          tab.setAttribute("aria-controls", panel.id);
          tab.addEventListener("click", function () { select(tab); });
        });

        function select(tab, focus) {
          tabs.forEach(function (t) {
            var on = t === tab;
            t.setAttribute("aria-selected", on ? "true" : "false");
            t.tabIndex = on ? 0 : -1;
            panelOf(t.getAttribute("data-tab")).hidden = !on;
          });
          if (focus) tab.focus();
          if (onSelect) onSelect(tab.getAttribute("data-tab"));
        }

        list.addEventListener("keydown", function (e) {
          var i = tabs.indexOf(document.activeElement);
          if (i < 0) return;
          var next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
          if (next === undefined) return;
          e.preventDefault();
          select(tabs[(next + tabs.length) % tabs.length], true);
        });
        list.hidden = false;
        return function (key) {
          var tab = tabs.filter(function (t) { return t.getAttribute("data-tab") === key; })[0];
          select(tab || tabs[0]);
        };
      }

      function panelsIn(scope) {
        return function (key) { return scope.querySelector('[data-panel="' + key + '"]'); };
      }

      var lists = section.querySelectorAll("[data-tablist]");
      var platforms = tablist(lists[0], panelsIn(section));
      var linuxPanel = section.querySelector('[data-panel="linux"]');
      var windowsPanel = section.querySelector('[data-panel="windows"]');
      var linux = tablist(linuxPanel.querySelector("[data-tablist]"), panelsIn(linuxPanel));
      var windows = tablist(windowsPanel.querySelector("[data-tablist]"), panelsIn(windowsPanel));
      section.classList.add("tabs-on");

      platforms(/Android/i.test(ua) ? "android" : /Windows/i.test(ua) ? "windows" : "linux");
      linux(/Ubuntu|Debian|Mint/i.test(ua) ? "deb" : /Fedora|Red Hat/i.test(ua) ? "rpm" : "flatpak");
      windows("installer");

      // ---- copy buttons ----
      var status = document.getElementById("copyStatus");
      var label = section.getAttribute("data-copy");
      var copied = section.getAttribute("data-copied");
      var manual = section.getAttribute("data-copy-manual");
      if (/Mac|iPhone|iPad/.test(navigator.platform || "")) manual = manual.replace(/(Ctrl|Strg)\+C/, "⌘C");
      var copyIcon = '<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
      var doneIcon = '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';

      function show(button, text, icon, done) {
        button.innerHTML = icon;
        button.appendChild(document.createTextNode(text));
        button.classList.toggle("done", !!done);
        status.textContent = done ? text : "";
      }

      function selectText(node) {
        var range = document.createRange();
        range.selectNodeContents(node);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      [].forEach.call(section.querySelectorAll("pre"), function (pre) {
        var code = pre.querySelector("code") || pre;
        var box = document.createElement("div");
        box.className = "cmd";
        pre.parentNode.insertBefore(box, pre);
        box.appendChild(pre);
        var button = document.createElement("button");
        button.type = "button";
        button.className = "copy";
        show(button, label, copyIcon);
        box.appendChild(button);
        var timer;
        function reset(after) {
          clearTimeout(timer);
          timer = setTimeout(function () { show(button, label, copyIcon); }, after);
        }
        function fallback() {
          selectText(code);
          show(button, manual, copyIcon);
          status.textContent = manual;
          reset(4000);
        }
        button.addEventListener("click", function () {
          var text = code.textContent;
          if (!navigator.clipboard || !window.isSecureContext) return fallback();
          navigator.clipboard.writeText(text).then(function () {
            show(button, copied, doneIcon, true);
            reset(2000);
          }, fallback);
        });
      });

      // ---- download buttons: the asset of the latest release, by name ----
      var buttons = section.querySelectorAll("[data-asset]");
      if (!buttons.length || !window.fetch) return;
      var abort = window.AbortController ? new AbortController() : null;
      var timeout = setTimeout(function () { if (abort) abort.abort(); }, 5000);
      fetch("https://api.github.com/repos/guilhermefeitosa66/OpenEmux/releases/latest",
        { headers: { Accept: "application/vnd.github+json" }, signal: abort ? abort.signal : undefined })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (release) {
          clearTimeout(timeout);
          var assets = (release && release.assets) || [];
          [].forEach.call(buttons, function (a) {
            var pattern = new RegExp(a.getAttribute("data-asset"));
            var hit = assets.filter(function (x) { return pattern.test(x.name); })[0];
            if (hit && /^https:\/\/github\.com\//.test(hit.browser_download_url)) {
              a.href = hit.browser_download_url;
            }
          });
        })
        .catch(function () { clearTimeout(timeout); });
    })();
  </script>
