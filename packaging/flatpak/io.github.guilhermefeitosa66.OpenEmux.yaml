# Flatpak manifest for OpenEmux.
#
# OpenEmux is a GNOME-native front-end; it plays games through the *separately
# installed* RetroArch Flatpak (org.libretro.RetroArch), launched on the host via
# flatpak-spawn. RetroArch is therefore NOT bundled here — the manifest only
# packages the Python app, PyYAML and python-xlib.
#
# Local test build:
#   flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48 org.flatpak.Builder
#   flatpak run org.flatpak.Builder --force-clean --user --install \
#     build-dir packaging/flatpak/io.github.guilhermefeitosa66.OpenEmux.yaml
#   flatpak run io.github.guilhermefeitosa66.OpenEmux
#
# For the Flathub submission, pin the `openemux` module source to a tagged commit.
app-id: io.github.guilhermefeitosa66.OpenEmux
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: openemux

# Sandbox permissions, and why each one is here.
#
# Two of these are the widest Flatpak has, and Flathub's linter asks for a
# justification in the submission. They are written down here rather than left
# as unremarked lines, because together they mean this sandbox provides
# essentially no confinement, and anyone reading the manifest is entitled to
# know that up front (issue #257).
#
#   --talk-name=org.freedesktop.Flatpak
#     Allows `flatpak-spawn --host` with arbitrary commands: unrestricted code
#     execution outside the sandbox. It is used deliberately and in exactly one
#     place, core/retroarch_launcher.py's _launch_prefix(), to run
#     `flatpak run org.libretro.RetroArch`. The permission is architecturally
#     required by the design: OpenEmux is a front-end for an emulator that
#     lives in its *own* Flatpak, on the host, and there is no portal for
#     "start that other app on a ROM". Bundling RetroArch instead would mean
#     shipping and updating an emulator this project does not maintain.
#
#   --filesystem=home
#     Load-bearing for four separate reasons today, each of which has to be
#     settled before it can be narrowed to a portal-granted ROM directory:
#       1. Three file choosers are Gtk.FileChooserDialog, the in-process
#          widget, which does not go through the portal and so can only reach
#          what the sandbox can already see (ui/window.py x2,
#          ui/artwork_manager.py). Porting them to Gtk.FileDialog is tracked
#          in issue #235 and is the prerequisite for everything below.
#       2. Config, playlists, input profiles, shaders and BIOS live in
#          ~/.openemux (core/config.py: DEFAULT_CONFIG_DIR). Without this
#          grant $HOME becomes ~/.var/app/<app-id>, and every existing install
#          would silently start from an empty library.
#       3. The ROM library defaults to ~/games/roms and is user-configurable
#          to anywhere; covers and cartridge labels are written beside it.
#       4. RetroArch runs on the *host* and is handed absolute paths -- the
#          ROM, and the --appendconfig override written under
#          ~/.openemux/runtime. Those paths have to mean the same thing on
#          both sides, which they only do while the sandbox sees the real
#          home.
#
# The rest are ordinary and narrow.
finish-args:
  # GTK UI. fallback-x11 and ipc are also what the game window needs: it
  # reparents RetroArch's X11 window into an OpenEmux one via python-xlib.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Cover-art sync from the libretro thumbnail servers, and the update check
  - --share=network
  # ROM library, artwork, and ~/.openemux -- see the note above
  - --filesystem=home
  # Read the RetroArch Flatpak's cores dir. --filesystem=home does NOT cover
  # it: Flatpak blacklists ~/.var/app from other apps' sandboxes, so without
  # this explicit grant no core is ever found (issue #179).
  - --filesystem=~/.var/app/org.libretro.RetroArch:ro
  # Launch the RetroArch Flatpak on the host via flatpak-spawn -- see the note
  # above
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - '*.pyc'
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - python3-pyyaml.yaml
  - python3-xlib.yaml

  - name: openemux
    buildsystem: simple
    build-commands:
      # The dir source copies the whole working tree, gitignored build
      # artifacts included, and setuptools reuses build/lib when it is there --
      # which installed a pre-SVG snapshot of the cartridge art over the real
      # one. Start from a clean slate.
      - rm -rf build dist
      - pip3 install --verbose --exists-action=i --no-index --no-build-isolation
        --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/common/io.github.guilhermefeitosa66.OpenEmux.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.guilhermefeitosa66.OpenEmux.metainfo.xml
      # The same entry every other format installs. The Flatpak used to carry
      # its own copy, which had drifted: no Version, no GenericName, no
      # StartupNotify, a different Comment and a different keyword list
      # (issue #253).
      - install -Dm644 packaging/common/openemux.desktop
        ${FLATPAK_DEST}/share/applications/io.github.guilhermefeitosa66.OpenEmux.desktop
      # TryExec is resolved against the *host* PATH once Flatpak exports the
      # entry, and no `openemux` binary exists there -- the entry would be
      # silently hidden from the menu. Inside the sandbox it is redundant:
      # `command: openemux` is /app/bin/openemux and always present.
      - sed -i '/^TryExec=/d'
        ${FLATPAK_DEST}/share/applications/io.github.guilhermefeitosa66.OpenEmux.desktop
      - install -Dm644 packaging/flatpak/io.github.guilhermefeitosa66.OpenEmux.png
        ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.guilhermefeitosa66.OpenEmux.png
      - install -Dm644 LICENSE
        ${FLATPAK_DEST}/share/licenses/io.github.guilhermefeitosa66.OpenEmux/LICENSE
      # The third-party notices: the OpenEmu console icons, the Adwaita
      # symbolic icons and the RetroArch AppImage are not MIT (issue #233).
      - install -Dm644 packaging/common/copyright
        ${FLATPAK_DEST}/share/licenses/io.github.guilhermefeitosa66.OpenEmux/copyright
    sources:
      # Our own builds (make flatpak, the openemux-flatpak repo's workflow)
      # build the checked-out tree, so releases need no manifest bump. The
      # Flathub submission variant replaces this with a git source pinned to
      # the release tag + commit.
      #
      # `make flatpak` points this at a staging copy holding only the build
      # inputs (packaging/flatpak/build.sh), so the skip list below is what
      # protects the other two ways this manifest is built -- a developer's
      # `flatpak run org.flatpak.Builder …` on a working tree, and the
      # openemux-flatpak workflow. Without it the source copies *everything*
      # beside the manifest: `.env` (SCREENSCRAPER_DEVID/DEVPASSWORD), `.git`,
      # `.venv/`, `AppDir/` and ~170 MB of `dist/`, all into the root-owned
      # build directory (issue #250).
      - type: dir
        path: ../..
        skip:
          - .env
          - .git
          - .venv
          - .worktree
          - .flatpak-builder
          - .flatpak-build-dir
          - flatpak-repo
          - dist
          - build
          - AppDir
          - appimage-build
          - appimage-builder-cache
          - htmlcov
