# python-xlib (and its only dependency, six) for the game window: reparenting
# RetroArch's window into an OpenEmux one is XReparentWindow (issue #199).
#
# The runtime carries neither, and the sandbox builds with --no-index, so both
# sdists are vendored here. In a Flatpak on Wayland there is no X socket at all
# (--socket=fallback-x11), and the app then simply leaves RetroArch its own
# window -- the module is what makes the feature work on an X11 session.
name: python3-xlib
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index
    --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    --no-build-isolation six python-xlib
sources:
