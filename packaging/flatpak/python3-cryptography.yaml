# cryptography (with cffi and pycparser): Share nearby makes this device's
# certificate with it (issue #587). Without it the feature turns itself off.
#
# The runtime carries none of the three, and the sandbox builds with
# --no-index. cryptography is Rust and cffi is C, so their sdists would need a
# Rust toolchain and an SDK extension to build; the manylinux wheels are
# vendored instead, pinned by sha256 like every other source here. The cffi
# wheel is for the runtime's interpreter (org.gnome.Platform 50 ships CPython
# 3.13); cryptography's is abi3. Versions follow requirements.lock.
name: python3-cryptography
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index
    --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    --no-build-isolation cryptography
