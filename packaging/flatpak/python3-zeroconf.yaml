# zeroconf (and its only dependency, ifaddr): Share nearby announces this
# device over mDNS with it (issue #587). Without it the app falls back to its
# own UDP beacon.
#
# The runtime carries neither, and the sandbox builds with --no-index.
# zeroconf publishes no pure-Python wheel and its sdist is built with Cython,
# so the manylinux wheels for the runtime's interpreter (org.gnome.Platform 50
# ships CPython 3.13) are vendored, pinned by sha256. Versions follow
# requirements.lock.
name: python3-zeroconf
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index
    --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    --no-build-isolation zeroconf
