# segno: Share nearby draws this device's address as a QR code with it
# (issue #589). Optional -- without it the address is shown as text only.
#
# The runtime does not carry it and the sandbox builds with --no-index. segno
# is pure Python with no dependencies, so its universal wheel is vendored,
# pinned by sha256. The version follows requirements.lock.
name: python3-segno
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index
    --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    --no-build-isolation segno
sources:
  - type: file
    url: https://files.pythonhosted.org/packages/d6/02/12c73fd423eb9577b97fc1924966b929eff7074ae6b2e15dd3d30cb9e4ae/segno-1.6.6-py3-none-any.whl
    sha256: 28c7d081ed0cf935e0411293a465efd4d500704072cdb039778a2ab8736190c7
