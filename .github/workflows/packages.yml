name: Packages

# A broken package used to surface on release day, in the middle of the release
# process, because nothing built one until then (issue #241). Everything needed
# was already in the repo: `packaging/build.sh <target>` is self-contained, runs
# in a pinned Docker image, and each format's script ends with its own install
# smoke test. This workflow only wires it up.
#
# No secrets are involved. Without a local `.env`, `_EMBEDDED_BLOB` stays empty
# and the artifacts carry no ScreenScraper credential -- by design, so a CI
# build is a build anybody could reproduce.

on:
  pull_request:
    branches: [ main, develop ]
    # Only the paths that can actually break a package. A UI-only PR does not
    # need 20 minutes of Docker to prove the .deb still installs.
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'requirements.lock'
      - 'Makefile'
      - 'src/openemux/data/**'
      - 'src/openemux/__init__.py'
      - '.github/workflows/packages.yml'
  push:
    branches: [ main ]
  schedule:
    # Monday morning: catches the formats that PRs do not build, and any rot in
    # the base images the Dockerfiles pin.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which formats to build'
        type: choice
        default: all
        options:
          - all
          - deb+rpm
          - appimage
          - flatpak
          - windows

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Pick the formats
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: Pick the formats
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.targets }}
        run: |
          case "$EVENT" in
            pull_request)
              # The two cheapest builds, and the .rpm is the format with the
              # fewest users to notice it broke.
              targets='["deb","rpm"]' ;;
            workflow_dispatch)
              case "$CHOICE" in
                deb+rpm)  targets='["deb","rpm"]' ;;
                appimage) targets='["appimage"]' ;;
                flatpak)  targets='["flatpak"]' ;;
                windows)  targets='["windows"]' ;;
                *)        targets='["deb","rpm","appimage","flatpak","windows"]' ;;
              esac ;;
            *)
              targets='["deb","rpm","appimage","flatpak","windows"]' ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "building: $targets"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One broken format should not hide the state of the other four.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk space
        # The AppImage and the Flatpak pull a whole GTK stack (and, for the
        # Flatpak, the GNOME SDK) into the container, and the Windows build
        # unpacks RetroArch *and* a MINGW64 GTK stack. A stock runner has
        # ~14 GB free, which the SDK alone can eat; the preinstalled toolchains
        # below are worth ~25 GB and nothing here uses them.
        if: matrix.target != 'deb' && matrix.target != 'rpm'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Load the fuse module
        # appimage-builder mounts squashfs and flatpak-builder runs bubblewrap;
        # both are handed /dev/fuse by packaging/build.sh, so the module has to
        # be up on the host first.
        if: matrix.target == 'appimage' || matrix.target == 'flatpak'
        run: sudo modprobe fuse

      # The Windows bundle ships RetroArch, and that binary is 193 MiB of
      # gitignored download rather than a committed vendor file -- so unlike
      # the four Linux formats, this build needs one thing fetched before it
      # can start. Cached on the manifest's own sha256: a RetroArch bump
      # changes the key and re-downloads, and nothing else does.
      - name: Restore the vendored RetroArch download
        if: matrix.target == 'windows'
        id: retroarch-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendors/.cache
          key: retroarch-win64-${{ hashFiles('vendors/manifest.json') }}

      - name: Install 7-Zip
        # scripts/vendor_retroarch.py unpacks RetroArch.7z with the 7-Zip CLI:
        # py7zr cannot read BCJ2, which is 7-Zip's default filter for x86
        # executables and therefore most of that archive.
        if: matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends 7zip

      - name: Fetch the vendored RetroArch
        # Named, not inferred: `make vendor-retroarch` takes the artifact for
        # the host it runs on, and this host is Linux. Verifies against the
        # sha256 in vendors/manifest.json, so a changed upstream file fails
        # here instead of shipping.
        if: matrix.target == 'windows'
        run: make vendor-retroarch-win64

      - name: Build the ${{ matrix.target }}
        run: ./packaging/build.sh ${{ matrix.target }}

      - name: Show what was produced
        run: ls -lh dist/

      - name: Upload the ${{ matrix.target }}
        # So a release candidate can be tested from a CI run instead of a local
        # build. The Flatpak also leaves an ostree repo behind; only the
        # single-file bundle in dist/ is worth carrying.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openemux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
