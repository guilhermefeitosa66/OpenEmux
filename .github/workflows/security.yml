name: Security

on:
  push:
    # develop as well as main: every day-to-day change lands on develop, so
    # scanning main alone meant a bandit finding or a vulnerable pin sat
    # unaudited for up to a week and across a dozen PRs, with no PR-time
    # feedback anywhere (issue #243).
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly scan so newly disclosed dependency CVEs are caught even without a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the pull request or push touches anything but the site.
  # A change confined to docs/, site/ and Markdown cannot break the app, so the
  # jobs below skip their work for it -- they still run and report success,
  # because they are required checks and a check that never reports leaves the
  # pull request unmergeable. Scheduled and manual runs always do the work.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Anything outside the site?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          range=""
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) range="$BASE..$HEAD" ;;
          esac
          # A new branch pushes with an all-zero "before": nothing to compare,
          # so it does the work.
          if [ -n "$range" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$range")
            printf '%s\n' "$files"
            outside=$(printf '%s\n' "$files" | grep -vE '^(docs|site)/|\.md$' || true)
            if [ -n "$files" ] && [ -z "$outside" ]; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  scan:
    name: Static analysis & dependency audit
    needs: changes
    # Skipped for a site-only change; a skipped job counts as passing. The
    # weekly schedule still audits the dependencies whatever changed.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag. A tag is mutable: whoever
      # can move `v4` can run their own code in a job that holds `contents:
      # write` for the badge push. The comment keeps the human-readable version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit

      - name: Bandit (static application security testing)
        # Skip subprocess findings (B404/B603/B607): OpenEmux intentionally launches
        # RetroArch and xdg-open with argument lists (never shell=True).
        run: bandit -r src --severity-level medium --confidence-level medium --skip B404,B603,B607

      - name: Install system libraries for the dependency audit
        # pycairo/PyGObject build from sdist against these headers; pip-audit
        # needs them to collect metadata for the pinned requirements.
        run: make install-sys-deps

      - name: pip-audit (what ships)
        # requirements.lock is what every package installs.
        run: pip-audit -r requirements.lock

      - name: pip-audit (what CI and developers install)
        # A strict superset of the runtime lock, and what `make setup-dev`
        # installs -- so the audited set and the installed set are the same
        # list. They used to differ: CI installed the unpinned requirements.txt
        # while the audit read the lock, and `coverage` was in neither.
        run: pip-audit -r requirements-dev.lock
