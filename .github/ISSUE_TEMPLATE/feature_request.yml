name: Feature request
description: Suggest something OpenEmux should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A described problem can be
        solved in ways neither of us has thought of yet; a proposed solution
        can only be accepted or rejected.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and Discussions, and this has not been asked for already.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: What you wanted to accomplish, and where OpenEmux got in the way. A concrete moment beats a general principle.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should happen instead?
      description: How you picture it working. A rough sketch, a description of the screen, or a link to how another frontend does it all help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing about it today?
      description: The workaround you use now, if any, and why it is not enough.
    validations:
      required: false

  - type: input
    id: scope
    attributes:
      label: Which consoles or systems does this touch?
      description: Leave blank if it applies everywhere.
      placeholder: "PS1 and Saturn, or: all of them"
    validations:
      required: false
