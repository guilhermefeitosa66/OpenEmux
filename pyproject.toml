[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openemux"
dynamic = ["version"]
description = "A Linux-native emulator frontend for RetroArch, inspired by OpenEmu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Feitoza" }]
# PyGObject and pycairo are provided by the GNOME runtime / system packages and
# are intentionally not listed here so `pip install .` stays buildable offline
# (Flatpak) and against distro GObject-introspection.
# python-xlib backs the game window: it reparents RetroArch's X11 window into
# an OpenEmux one (issue #199). Missing it costs the game window, not the app.
dependencies = ["PyYAML", "python-xlib"]

[project.urls]
Homepage = "https://github.com/guilhermefeitosa66/OpenEmux"
Issues = "https://github.com/guilhermefeitosa66/OpenEmux/issues"

[project.scripts]
openemux = "openemux.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "openemux.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# Measure the whole package, not just the modules the tests happen to import:
# files under src/openemux that no test touches count as 0%, so the total is
# an honest number for the entire app (UI included).
source = ["src/openemux"]
relative_files = true

[tool.coverage.report]
# A floor, not a target. Without one, coverage could only ever be reported --
# a PR that deleted tests, or added a module nothing exercises, stayed green
# and the badge quietly moved (issue #242). Raise it as coverage rises; never
# lower it to make a red run pass.
fail_under = 50

[tool.setuptools.package-data]
# Every non-Python file the app reads at runtime. Only the pip-installed
# builds (the Flatpak) honor this list -- the deb/rpm/AppImage copy src/
# wholesale -- so anything missing here goes unnoticed until it is missing in
# the sandbox. tests/test_package_data.py fails when an asset is not covered.
openemux = [
    "ui/style.css",
    "ui/assets/**/*.png",
    "ui/assets/**/*.svg",
    # License notices for the third-party artwork; they must ship with the
    # icons they cover -- the OpenEmu terms require the notice to travel with
    # a binary distribution, and the Flatpak is the one build that installs
    # from this list rather than copying src/ wholesale (issue #233).
    "ui/assets/icons/symbolic/LICENSE",
    "ui/assets/icons/ATTRIBUTION.md",
    # The game-name database (issue #184), consumed by the staged cover
    # lookup and the cover-picker suggestions.
    "data/games.db.zip",
]
