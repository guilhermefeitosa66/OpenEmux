[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openemux"
dynamic = ["version"]
description = "A Linux-native emulator frontend for RetroArch, inspired by OpenEmu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Feitoza" }]
# PyGObject and pycairo are provided by the GNOME runtime / system packages and
# are intentionally not listed here so `pip install .` stays buildable offline
# (Flatpak) and against distro GObject-introspection.
# python-xlib backs the game window: it reparents RetroArch's X11 window into
# an OpenEmux one (issue #199). Missing it costs the game window, not the app.
dependencies = ["PyYAML", "python-xlib"]

[project.urls]
Homepage = "https://github.com/guilhermefeitosa66/OpenEmux"
Issues = "https://github.com/guilhermefeitosa66/OpenEmux/issues"

[project.scripts]
openemux = "openemux.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "openemux.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Correctness only. This project deliberately has no formatter and that stays:
# nothing here has an opinion about quotes, line length, import order or
# whitespace. What it does catch is the class of mistake a test only finds by
# executing the line -- cheaper than a test for the whole class of defect, and
# it still holds for the lines coverage does not reach.
target-version = "py310"
extend-exclude = ["AppDir", "appimage-build", "vendors", "flatpak-repo", "_local"]

[tool.ruff.lint]
# F     pyflakes: undefined names, unused imports, redefinitions, f-string
#       mistakes -- the actual bugs.
# E9    syntax and IO errors.
# PLE   pylint's error category: real errors only, no style.
# B0..  a bugbear subset, each one a bug rather than a preference:
#       B002 ++x, B006 mutable default argument, B012 break/return in finally
#       swallowing the exception, B017 assertRaises(Exception), B023 a loop
#       variable captured by a closure, B026 star-arg after keyword.
select = ["F", "E9", "PLE", "B002", "B006", "B012", "B017", "B023", "B026"]

[tool.coverage.run]
# Measure the whole package, not just the modules the tests happen to import:
# files under src/openemux that no test touches count as 0%, so the total is
# an honest number for the entire app (UI included).
source = ["src/openemux"]
relative_files = true

[tool.coverage.report]
# A floor, not a target. Without one, coverage could only ever be reported --
# a PR that deleted tests, or added a module nothing exercises, stayed green
# and the badge quietly moved (issue #242). Raise it as coverage rises; never
# lower it to make a red run pass.
#
# One point below the total the suite actually reaches, not level with it: the
# matrix runs four interpreters, and a `try`/`except` a newer stdlib no longer
# takes moves the number by a fraction. A floor that has to be re-pinned on
# every patch release is a floor nobody raises.
#
# The UI is measured too, and most of it needs a display: the tests that build
# real widgets skip themselves without one (see tests/gtk_display.py), so a
# headless run lands far below this floor. CI runs the suite under
# `xvfb-run -a`, which is what makes the number honest -- and `make coverage`
# on a desktop matches it.
fail_under = 92

[tool.setuptools.package-data]
# Every non-Python file the app reads at runtime. Only the pip-installed
# builds (the Flatpak) honor this list -- the deb/rpm/AppImage copy src/
# wholesale -- so anything missing here goes unnoticed until it is missing in
# the sandbox. tests/test_package_data.py fails when an asset is not covered.
openemux = [
    "ui/style.css",
    "ui/assets/**/*.png",
    "ui/assets/**/*.svg",
    # License notices for the third-party artwork; they must ship with the
    # icons they cover -- the OpenEmu terms require the notice to travel with
    # a binary distribution, and the Flatpak is the one build that installs
    # from this list rather than copying src/ wholesale (issue #233).
    "ui/assets/icons/symbolic/LICENSE",
    "ui/assets/icons/ATTRIBUTION.md",
    # The game-name database (issue #184), consumed by the staged cover
    # lookup and the cover-picker suggestions.
    "data/games.db.zip",
]
